name: markdownlint

"on":
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  markdownlint:
    runs-on: ubuntu-22.04-htzhel1-ax42-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx markdownlint-cli2 --config .markdownlint-cli2.yaml "**/*.md"
