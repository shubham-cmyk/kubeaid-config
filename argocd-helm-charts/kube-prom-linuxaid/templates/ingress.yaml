apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.customerid }}
  namespace: monitoring-{{ .Values.customerid }}
  annotations:
    kubernetes.io/ingress.class: traefik-cert-manager
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/service.serverstransport: traefik-puppet-agent-auth@kubernetescrd
spec:
  rules:
  - host: prometheus.obmondo.com
    http:
      paths:
      - pathType: Prefix
        path: /{{ .Values.customerid }}
        backend:
          service:
            name: prometheus-main
            port:
              name: web
