apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ingressroutetcp{{ .Values.customerid }}
  namespace: monitoring-{{ .Values.customerid }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: HostSNI(`prometheus.obmondo.com`)
    services:
    - name: prometheus-main
      port: 9090
      weight: 10
      terminationDelay: 400
  tls:
    options:
      name: puppet-agent-auth
      namespace: traefik
    domains:
    - main: prometheus.obmondo.com
    passthrough: false
