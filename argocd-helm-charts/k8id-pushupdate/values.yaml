# Default values for pushupdate-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.obmondo.com/kubernetes/k8id-support-software
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: "k8id-support-software-registry-secret"

nameOverride: "k8id-pushupdate"
fullnameOverride: "k8id-pushupdate"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager

  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: "pushupdate.kbm.obmondo.com"
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            serviceName: k8id-pushupdate
            servicePort: 80
  tls:
    - secretName: pushupdate-obmondo-com-tls
      hosts:
        - "pushupdate.kbm.obmondo.com"

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
# targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: DEBUG
    value: "true"
  - name: PORT
    value: "8080"
  - name: K8ID_REPO_URL
    valueFrom:
      secretKeyRef:
        name: k8id-pushupdate
        key: k8id-repo-url
  - name: K8ID_REPO_TOKEN
    valueFrom:
      secretKeyRef:
        name: k8id-pushupdate
        key: k8id-repo-token
  - name: K8ID_REPO_DEFAULT_BRANCH
    valueFrom:
      secretKeyRef:
        name: k8id-pushupdate
        key: k8id-repo-default-branch
  - name: K8ID_PUSHUPDATE_CUSTOMER_CONFIG
    valueFrom:
      secretKeyRef:
        name: k8id-pushupdate
        key: k8id-pushupdate-customer-config
