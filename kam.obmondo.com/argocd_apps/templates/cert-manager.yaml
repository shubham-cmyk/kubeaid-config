apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argocd-helm-charts/cert-manager
    repoURL: https://gitlab.enableit.dk/kubernetes/kubernetes-config-enableit.git
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
      - ../../kam.obmondo.com/argocd_apps/values-cert-manager.yaml
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
