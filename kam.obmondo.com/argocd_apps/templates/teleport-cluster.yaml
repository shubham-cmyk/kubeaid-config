apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teleport-cluster
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: teleport-cluster
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: argocd-helm-charts/teleport-cluster
    repoURL: 'https://gitlab.enableit.dk/kubernetes/kubernetes-config-enableit.git'
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
      - ../../kam.obmondo.com/argocd_apps/values-teleport-cluster.yaml
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
