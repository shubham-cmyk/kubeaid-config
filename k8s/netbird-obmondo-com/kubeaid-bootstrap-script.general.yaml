git:
  sshUsername: git
  useSSHAgent: true
  knownHosts:
    - "[gitea.obmondo.com]:2223 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFDZKKX5kDl8liLAp6+pkvzcbAODbJ9x2iZlBwUCedH0SiiFB8J8GFBnR/WwwL57tUTtMv+bdvSPx4HyAPIc7e4="

forkURLs:
  kubeaid:
    url: https://github.com/Obmondo/kubeaid.git
    version: 29.0.7
  kubeaidConfig:
    url: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
    directory:

cluster:
  type: vpn
  name: netbird-obmondo-com
  k8sVersion: v1.35.4
  enableAuditLogging: false
  acmeEmail: ops@obmondo.com
  apiServer:
    extraArgs: {}
    extraVolumes: []
    files: []
    oidc:
      issuerUrl: https://keycloak.vpn.obmondo.com/realms/obmondo
      clientId: kubernetes-netbird-obmondo-com
  keycloak:
    mode: managed
    dns: keycloak.vpn.obmondo.com
  netbird:
    dns: netbird.vpn.obmondo.com
  argoCD:
    deployKeys:
      kubeaidConfig:
        privateKeyFilePath: /tmp/ssh-priv

kubePrometheus:
  version: v0.17.0

cloud:
  hetzner:
    mode: hcloud
    sshKeyPair:
      name: netbird-obmondo-com
      useSSHAgent: true
    hcloud:
      zone: eu-central
      imageName: ubuntu-24.04
      hetznerNetwork:
        cidr: "10.0.0.0/16"
        hcloudServersSubnetCIDR: "10.0.0.0/24"
    controlPlane:
      hcloud:
        machineType: cpx32
        replicas: 1
        loadBalancer:
          enabled: true
          region: hel1
          endpoint: api.vpn.obmondo.com
      regions:
        - hel1
    nodeGroups:
      hcloud: []

