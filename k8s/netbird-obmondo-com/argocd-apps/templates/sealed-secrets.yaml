apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: master
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  project: kubeaid
  sources:
    - repoURL: https://github.com/ashish1099/kubeaid.git
      path: argocd-helm-charts/sealed-secrets
      targetRevision: master
      helm:
        valueFiles:
          - $values/k8s/netbird-obmondo-com/argocd-apps/values-sealed-secrets.yaml
    - repoURL: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
