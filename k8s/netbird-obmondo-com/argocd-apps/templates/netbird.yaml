apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: 29.0.6
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "25"
  name: netbird
  namespace: argocd
spec:
  destination:
    namespace: netbird
    server: https://kubernetes.default.svc
  project: kubeaid
  sources:
    - repoURL: https://github.com/Obmondo/KubeAid.git
      path: argocd-helm-charts/netbird
      targetRevision: 29.0.6
      helm:
        valueFiles:
          - $values/k8s/netbird-obmondo-com/argocd-apps/values-netbird.yaml
    - repoURL: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
