netbird-operator:
  managementURL: "https://netbird.vpn.obmondo.com"

# Mesh exposure of this cluster (NetworkRouter + NetworkResource,
# consumed by the netbird-operator wrapper chart). This is the VPN-host
# cluster; the router publishes each exposed Service as a record under
# the vpn.obmondo.com zone, reached over the mesh by Mgmt policies
# targeting the group below.
networkRouter:
  enabled: true
  # Existing DNS zone in NetBird Mgmt; the router publishes each
  # exposed Service as a record under it.
  dnsZone: vpn.obmondo.com
  replicas: 1

networkResources:
  - name: argocd
    namespace: argocd
    service: argocd-server
    groups: ["k8s-netbird-obmondo-com"]
  - name: prometheus
    namespace: traefik
    service: traefik-internal
    groups: ["k8s-netbird-obmondo-com"]
  - name: alertmanager
    namespace: traefik
    service: traefik-internal
    groups: ["k8s-netbird-obmondo-com"]
  - name: grafana
    namespace: traefik
    service: traefik-internal
    groups: ["k8s-netbird-obmondo-com"]

# NetBird API-server proxy (operator >= 0.7.0): a dedicated mesh peer that
# proxies kubectl to the in-cluster apiserver and impersonates the caller's
# NetBird identity. Reach it via `netbird kubernetes write-kubeconfig
# netbird-obmondo-com` at a unique per-cluster FQDN — so it sidesteps the
# 10.96.0.1 ClusterIP collision the `kubernetes` NetworkResource above hits
# against kbm. Once the proxy works, that `kubernetes` resource can be dropped.
# Access is still gated by RBAC bound to the NetBird users/groups + the Mgmt
# policy targeting the group below.
clusterProxy:
  enabled: true
  clusterName: netbird-obmondo-com
