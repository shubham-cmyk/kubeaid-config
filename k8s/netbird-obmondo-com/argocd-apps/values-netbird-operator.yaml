netbird-operator:
  managementURL: "https://netbird.vpn.obmondo.com"

# Mesh exposure of this cluster (NetworkRouter + NetworkResource,
# consumed by the netbird-operator wrapper chart). This is the VPN-host
# cluster; the router publishes each exposed Service as a record under
# the vpn.obmondo.com zone, reached over the mesh by Mgmt policies
# targeting the group below.
networkRouter:
  enabled: true
  # Existing DNS zone in NetBird Mgmt; the router publishes each
  # exposed Service as a record under it.
  dnsZone: vpn.obmondo.com
  replicas: 1

networkResources:
  # kube-apiserver over the mesh: routes the `kubernetes` Service and
  # publishes it in the vpn.obmondo.com zone. Mesh access is granted by
  # the Mgmt policy targeting the group below.
  - name: kube-api
    namespace: default
    service: kubernetes
    groups: ["k8s-vpn-obmondo-com"]
  - name: argocd
    namespace: argocd
    service: argocd-server
    groups: ["k8s-vpn-obmondo-com"]
  - name: prometheus
    namespace: monitoring
    service: prometheus-k8s
    groups: ["k8s-vpn-obmondo-com"]
  - name: alertmanager
    namespace: monitoring
    service: alertmanager-main
    groups: ["k8s-vpn-obmondo-com"]
  - name: grafana
    namespace: monitoring
    service: grafana
    groups: ["k8s-vpn-obmondo-com"]
  - name: netbird
    namespace: netbird
    service: netbird-dashboard
    groups: ["k8s-vpn-obmondo-com"]
