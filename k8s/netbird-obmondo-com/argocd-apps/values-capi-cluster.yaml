global:
  clusterName: netbird-obmondo-com
  kubernetes:
    version: v1.35.4
  kubeaid:
    repo: https://github.com/Obmondo/KubeAid.git
    # Pinned for the in-node `git clone` in postKubeadmCommands. Keeps
    # Cilium / CCM installs on the control-plane on the same chart
    # snapshot kubeaid-cli rendered locally, instead of letting them
    # drift to whatever the fork's default branch happens to be at
    # node bootstrap time.
    version: 29.0.5
  kubeaidConfig:
    repo: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
  additionalUsers:
    []
provider:
  hetzner: true

hetzner:
  mode: hcloud

  sshKeyPair:
    name: netbird-obmondo-com
  hcloud:
    zone: eu-central
    imageName: ubuntu-24.04
    cidrBlock: 10.0.0.0/16
    subnetCidrBlock: 10.0.0.0/24

  controlPlane:
    regions:
      - hel1
    endpoint:
      host: api.vpn.obmondo.com
    loadBalancer:
      privateIP: 10.0.0.3
      bootstrapPublicIP: 95.217.168.170
    hcloud:
      machineType: cpx32
      replicas: 1
      loadBalancer:
        enabled: false
        region: hel1

  nodeGroups:
    hcloud: []
    bareMetal: []
