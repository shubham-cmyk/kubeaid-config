global:
  clusterName: netbird-obmondo-com
  kubernetes:
    version: v1.35.4
  kubeaid:
    repo: https://github.com/Obmondo/kubeaid.git
    # Pinned for the in-node `git clone` in postKubeadmCommands. Keeps
    # Cilium / CCM installs on the control-plane on the same chart
    # snapshot kubeaid-cli rendered locally, instead of letting them
    # drift to whatever the fork's default branch happens to be at
    # node bootstrap time.
    version: 29.0.9
  kubeaidConfig:
    repo: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
  additionalUsers:
    []
provider:
  hetzner: true

hetzner:
  mode: hcloud

  sshKeyPair:
    name: netbird-obmondo-com
  hcloud:
    zone: eu-central
    imageName: ubuntu-24.04
    cidrBlock: 10.0.0.0/16
    subnetCidrBlock: 10.0.0.0/24

  controlPlane:
    regions:
      - hel1
    endpoint:
      host: api.vpn.obmondo.com
    # Extra kube-apiserver cert SANs — lets clients validate the apiserver
    # cert under alternate names. The NetBird-mesh form here means kubectl
    # works over the mesh against kubernetes.vpn.obmondo.com (no x509 error).
    extraCertSANs:
      - kubernetes.vpn.obmondo.com
    # API-server audit logging + OIDC auth, mirrored from kbm. OIDC values
    # adapted for netbird (clientId/audience + keycloak path) — VERIFY before
    # rolling, a bad auth-config breaks apiserver startup. Applying changes the
    # apiserver static pod (args + mounted files), so it needs a CP roll.
    apiServer:
      extraArgs:
        audit-log-maxage: "10"
        audit-log-maxbackup: "1"
        audit-log-maxsize: "100"
        audit-log-path: /var/log/kubernetes/audit/audit.log
        audit-policy-file: /etc/kubernetes/audit-policy.yaml
        authentication-config: /etc/kubernetes/auth-config.yaml
      extraVolumes:
        - name: audit-policy-file
          hostPath: /etc/kubernetes/audit-policy.yaml
          mountPath: /etc/kubernetes/audit-policy.yaml
          pathType: FileOrCreate
          readOnly: true
        - name: audit-log
          hostPath: /var/log/kubernetes/audit
          mountPath: /var/log/kubernetes/audit
          pathType: DirectoryOrCreate
          readOnly: false
        - name: authentication-config
          hostPath: /etc/kubernetes/auth-config.yaml
          mountPath: /etc/kubernetes/auth-config.yaml
          pathType: File
          readOnly: true
      files:
        - path: /etc/kubernetes/audit-policy.yaml
          content: |
            apiVersion: audit.k8s.io/v1
            kind: Policy
            omitStages:
              - "RequestReceived"
            rules:
              - level: Metadata
                omitStages:
                  - "RequestReceived"
        - path: /etc/kubernetes/auth-config.yaml
          content: |
            apiVersion: apiserver.config.k8s.io/v1
            jwt:
            - claimMappings:
                groups:
                  claim: groups
                  prefix: ""
                username:
                  claim: email
                  prefix: ""
              issuer:
                audiences:
                - kubernetes-netbird-obmondo-com
                url: https://keycloak.vpn.obmondo.com/realms/obmondo
            - claimMappings:
                groups:
                  claim: groups
                  prefix: ""
                username:
                  claim: email
                  prefix: ""
              issuer:
                audiences:
                - netbird-obmondo-com
                url: https://keycloak.obmondo.com/auth/realms/Obmondo
            kind: AuthenticationConfiguration
    loadBalancer:
      privateIP: 10.0.0.3
      bootstrapPublicIP: 95.217.168.170
    hcloud:
      machineType: cpx32
      replicas: 1
      loadBalancer:
        enabled: false
        region: hel1

  nodeGroups:
    hcloud: []
    bareMetal: []
