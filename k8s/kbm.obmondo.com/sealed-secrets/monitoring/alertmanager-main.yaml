apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: alertmanager-main
  namespace: monitoring
spec:
  encryptedData:
    oncall-url: 
  template:
    data:
      alertmanager.yaml: |
        global:
          resolve_timeout: 5m

        inhibit_rules:
        - "equal":
          - "namespace"
          - "alertname"
          "source_matchers":
          - "severity = critical"
          "target_matchers":
          - "severity =~ warning|info"
        - "equal":
          - "namespace"
          - "alertname"
          "source_matchers":
          - "severity = warning"
          "target_matchers":
          - "severity = info"
        - "equal":
          - "namespace"
          "source_matchers":
          - "alertname = InfoInhibitor"
          "target_matchers":
          - "severity = info"

        route:
          group_by:
            - 'namespace'
          group_wait: 10s
          group_interval: 10s
          repeat_interval: 1h
          receiver: 'obmondo'
          routes:
          - receiver: 'obmondo'
            matchers:
            - "alertname = Watchdog"
          - receiver: 'null'
            matchers:
            - "namespace =~ testing|obmondo-ci"
          - receiver: 'null'
            matchers:
            - "alertname = InfoInhibitor"
          - receiver: oncall
            group_by: [alertname, datacenter, app]
            continue: true
          - receiver: obmondo
            continue: true

        receivers:
          - name: "null"
          - name: oncall
            webhook_configs:
              - url: {{ index . "oncall-url" }}
                send_resolved: true
                max_alerts: 300
          - name: obmondo
            webhook_configs:
              - url: https://alerts.obmondo.com/hooks/alertmanager
                send_resolved: true
                max_alerts: 0
                http_config:
                  tls_config:
                    server_name: alerts.obmondo.com
                    cert_file: /etc/alertmanager/secrets/obmondo-clientcert/tls.crt
                    key_file: /etc/alertmanager/secrets/obmondo-clientcert/tls.key
                    insecure_skip_verify: false
        templates:
        - /etc/alertmanager/config/*.tmpl
    metadata:
      creationTimestamp: null
      name: alertmanager-main
      namespace: monitoring
