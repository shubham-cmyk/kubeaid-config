replicaCount: 1
image:
  tag: obmondo-beta-v2.3.6
  pullPolicy: Always
ingress:
  hosts:
    - host: beta.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: beta-obmondo-com-tls
      hosts:
        - beta.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
