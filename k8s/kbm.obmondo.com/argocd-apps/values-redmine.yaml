redmine:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
      traefik.ingress.kubernetes.io/router.middlewares: traefik-jwt@kubernetescrd
    hosts:
      - host: "support2.obmondo.com"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: true
    hostname: "support2.obmondo.com"

  image:
    registry: registry.obmondo.com
    repository: obmondo/dockerfiles/redmine
    pullPolicy: Always
    tag: 5.0.2
    pullSecrets:
      - "obmondo-dockerfiles-registry-secret"
