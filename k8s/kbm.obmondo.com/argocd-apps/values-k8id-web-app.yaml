replicaCount: 1
image:
  tag: k8id-beta-v2.2.4
  pullPolicy: Always
ingress:
  hosts:
    - host: beta.k8id.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: beta-k8id-io-tls
      hosts:
        - beta.k8id.io
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect
