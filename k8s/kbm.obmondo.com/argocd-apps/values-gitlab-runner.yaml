gitlab-runner:
  replicas: 12
  gitlabUrl: https://gitlab.enableit.dk/
  runners:
    tags: kbm.obmondo.com, kbm

  envVars:
    - name: KUBERNETES_POLL_TIMEOUT
      value: "900"  # default is 180

runner:
  nameSpace:
    create: true
    name: obmondo-ci
  serviceAccount:
    create: true
    name: obmondo-gitlab-ci
