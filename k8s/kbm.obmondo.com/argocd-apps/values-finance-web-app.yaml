replicaCount: 1
image:
  tag: beta-finance-v3.3.2
  pullPolicy: Always
ingress:
  hosts:
    - host: beta-finance.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: beta-finance-com-tls
      hosts:
        - beta-finance.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
