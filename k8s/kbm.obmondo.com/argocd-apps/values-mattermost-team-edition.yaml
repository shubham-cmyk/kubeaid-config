mattermost-team-edition:
  image:
    repository: mattermost/mattermost-team-edition
    tag: 10.3.1@sha256:5892ec2bdb79d74adafd2ef689ac4ea585370646a8028cc6da249ed2715ae6fa
  ingress:
    enabled: true
    path: /
    hosts:
      - mattermost.kbm.obmondo.com
    extraHosts:
      - host: webchat.kbm.obmondo.com
        servicePort: 8989
    tls:
      - secretName: mattermost.kbm.obmondo.com
        hosts:
          - mattermost.kbm.obmondo.com
      - secretName: webchat.kbm.obmondo.com
        hosts:
          - webchat.kbm.obmondo.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
  extraPorts:
    - name: matternelle
      port: 8989
      protocol: TCP
  config:
    MM_GITLABSETTINGS_USERAPIENDPOINT: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/userinfo"
    MM_GITLABSETTINGS_AUTHENDPOINT: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/auth"
    MM_GITLABSETTINGS_TOKENENDPOINT: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/token"
    MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS: "enableit.dk,obmondo.com,blackwoodseven.com,vsen.dk,gnhearing.com,gn.com, nresound.com,jabra.com,ks.kk.dk,kk.dk,ebillet.dk,kilroy.net,hobbii.dk"
    MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "true"
    MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: "https://push-test.mattermost.com"
    MM_SERVICESETTINGS_SITEURL: "https://mattermost.kbm.obmondo.com"
    MM_SERVICESETTINGS_COLLAPSEDTHREADS: "default_on"
    MM_SERVICESETTINGS_THREADAUTOFOLLOW: "true"
    MM_SERVICESETTINGS_ENABLELINKPREVIEWS: "true"
    MM_SERVICESETTINGS_RESTRICTLINKPREVIEWS: "github.com"
    MM_SERVICESETTINGS_ENABLEAPIUSERDELETION: "true"
    MM_PLUGINSETTINGS_ENABLE: "true"
    MM_PLUGINSETTINGS_PLUGINS: |-
      {
        "com.mattermost.nps": {
          "enablesurvey": false
        },
        "com.mattermost.plugin-incident-management": {
          "BotUserID": "5h9oef4z1tnsfedg9jbdfh6j3c"
        },
        "jitsi": {
          "jitsiappid": null,
          "jitsiappsecret": null,
          "jitsicompatibilitymode": false,
          "jitsiembedded": null,
          "jitsijwt": null,
          "jitsilinkvalidtime": 30,
          "jitsinamingscheme": "uuid",
          "jitsiurl": "https://meet.jit.si"
        },
        "mattermost-autolink": {
          "EnableAdminCommand": true,
          "EnableOnUpdate": true,
          "Links": [
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "GN_SNOW",
              "Pattern": "(?P<ticket_id>TCK[0-9]{7})",
              "Scope": null,
              "Template": "[GNSNOW${ticket_id}](https://meet.jit.si)"
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "devops",
              "Pattern": "@devops*",
              "Scope": null,
              "Template": "[@devops](https://gnsn.service-now.com/text_search_exact_match.do?sysparm_search=${ticket_id})",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "gitlab",
              "Pattern": "MR-(?P<repo>.+)-(?P<id>\\d+)",
              "Scope": null,
              "Template": "[MR-${repo}-${id}](https://gitea.obmondo.com/Obmondo/${repo}/merge_requests/${id})",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "india",
              "Pattern": "@india*",
              "Scope": null,
              "Template": "[@india](\\\\*@deepak@sandeep@aman0@sachin@ajaiswal\\\\*)",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "oncall",
              "Pattern": "@oncall*",
              "Scope": null,
              "Template": "[@oncall](\\\\*@deepak@aman0\\\\*)",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "reviewer",
              "Pattern": "@reviewer*",
              "Scope": null,
              "Template": "[@reviewer](\\\\*@ajaiswal@klavsklavsen@runejuhl@aman0\\\\*)",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "support",
              "Pattern": "#(?P<ticket_id>[0-9]{4,5})",
              "Scope": null,
              "Template": "[issue#${ticket_id}](https://gitea.obmondo.com/issues/${ticket_id})",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "@meghashyam",
              "Pattern": "",
              "Scope": null,
              "Template": "",
              "WordMatch": false
            },
            {
              "DisableNonWordPrefix": false,
              "DisableNonWordSuffix": false,
              "Disabled": false,
              "Name": "@abhishek",
              "Pattern": "",
              "Scope": null,
              "Template": "",
              "WordMatch": false
            },
            {
              "ProcessBotPosts": true,
              "Name": "Duck AI",
              "Pattern": "@duck-ai",
              "Template": "[@duck-ai](https://duck.ai)",
              "Scope": null,
              "WordMatch": false
            },
            {
              "ProcessBotPosts": true,
              "DisableNonWordPrefix":true,
              "DisableNonWordSuffix":false,
              "Disabled":false,
              "Name":"operations",
              "Pattern":"@operations*",
              "Scope":null,
              "Template":"@deepak @basit @hritik @sidharth @divyam @smahar",
              "WordMatch":false
            }
          ],
          "PluginAdmins": "ajaiswal,klavsklavsen"
        },
        "net.appmodule.mattermost-jitsi-plugin": {
          "jitsiurl": null
        }
      }

    MM_PLUGINSETTINGS_PLUGINSTATES: "{\n\"com.github.matterpoll.matterpoll\":{\n\"Enable\":true\n},\n\"com.github.moussetc.mattermost.plugin.giphy\":{\n\"Enable\":true\n},\n\"com.mattermost.apps\":{\n\"Enable\":true\n},\n\"com.mattermost.custom-attributes\":{\n\"Enable\":true\n},\n\"com.mattermost.nps\":{\n\"Enable\":false\n},\n\"com.mattermost.plugin-channel-export\":{\n\"Enable\":false\n},\n\"com.mattermost.plugin-incident-management\":{\n\"Enable\":false\n},\n\"com.mattermost.plugin-todo\":{\n\"Enable\":false\n},\n\"com.mattermost.welcomebot\":{\n\"Enable\":false\n},\n\"focalboard\":{\n\"Enable\":false\n},\n\"jitsi\":{\n\"Enable\":true\n},\n\"mattermost-autolink\":{\n\"Enable\":true\n},\n\"memes\":{\n\"Enable\":true\n},\n\"net.appmodule.mattermost-jitsi-plugin\":{\n\"Enable\":false\n},\n\"playbooks\":{\n\"Enable\":false\n},\n\"com.gitlab.itk.fr.matternelle\":{\n\"Enable\":true\n},\n\"mattermost-plugin-remind\":{\n\"Enable\":true\n}\n}"

