# NOTE: This is a common values for all the Obmondo customers
# if you dont want these default, you can override in customer specific values file
puppetserver:
  global:
    extraEnv:
      AUTOSIGN: /etc/puppetlabs/code/environments/master/puppet_autosign.rb
      PUPPET_REPORTS: puppetdb,prometheus
      PUPPETSERVER_ENVIRONMENT_TIMEOUT: 0
      PUPPETSERVER_ENC_PATH: /etc/puppetlabs/code/environments/master/puppet_enc.rb
  storage:
    storageClass: openebs-zfspv-shared
  puppetdb:
    persistence:
      size: 1Gi
    extraEnv:
      PUPPETDB_JAVA_ARGS: "-Xms512m -Xmx2500m -XX:+HeapDumpOnOutOfMemoryError"

  puppetserver:
    puppeturl: "https://gitea.obmondo.com/EnableIT/LinuxAid.git"
    masters:
      extraEnv:
        PUPPETSERVER_JAVA_ARGS: "-Xms512m -Xmx2500m -XX:+HeapDumpOnOutOfMemoryError"
        PUPPETSERVER_MAX_ACTIVE_INSTANCES: 4
      resources:
        requests:
          memory: 3096Mi
          cpu: 1000m
        limits:
          memory: 3096Mi
    customentrypoints:
      enabled: true
      configmaps:
        configure_external_nodes.sh: |-
          #!/bin/bash

          set -e
          # Configure puppet to use a certificate autosign script (if it exists)
          # AUTOSIGN=true|false|path_to_autosign.conf
          if test -n "${PUPPETSERVER_ENC_PATH}" ; then
            puppet config set external_nodes "$PUPPETSERVER_ENC_PATH" --section server
            puppet config set node_terminus "exec" --section server
          fi

          puppet config set hostprivkey /etc/puppetlabs/puppet/ssl/private_keys/puppet.pem
          puppet config set hostcert /etc/puppetlabs/puppet/ssl/certs/puppet.pem
          puppet config set hostpubkey /etc/puppetlabs/puppet/ssl/public_keys/puppet.pem

          puppetserver gem install fugit -v 1.9.0
          puppetserver gem install tzinfo-data

          cat <<EOL > "/etc/puppetlabs/puppet/prometheus.yaml"
          ---
          textfile_directory: /etc/puppetlabs/code/prometheus-dropzone
          environments:
            - master
          stale_time: 30
          EOL

          mkdir -p /etc/puppetlabs/code/prometheus-dropzone
          chown puppet:puppet /etc/puppetlabs/code/prometheus-dropzone
    persistence:
      code:
        size: 8Gi
  r10k:
    code:
      cronJob:
        schedule: "*/2 * * * *"
      viaHttps:
        credentials:
          existingSecret: puppet-git-secret
    hiera:
      cronJob:
        schedule: "*/2 * * * *"
      viaHttps:
        credentials:
          existingSecret: hiera-git-secret
  hiera:
    eyaml:
      existingSecret: eyaml-keys

