    persistence:
      size: 2Gi
    extraEnv:
      PUPPETDB_JAVA_ARGS: "-Xms512m -Xmx2500m -XX:+HeapDumpOnOutOfMemoryError"
  puppetserver:
    masters:
      extraEnv:
        PUPPETSERVER_JAVA_ARGS: "-Xms512m -Xmx5196m -XX:+HeapDumpOnOutOfMemoryError"
        PUPPETSERVER_MAX_ACTIVE_INSTANCES: 4
      resources:
        requests:
          memory: 6144Mi
          cpu: 3000m
        limits:
          memory: 6144Mi
      fqdns:
        alternateServerNames: 7ejidqmfi9.puppet.obmondo.com
  hiera:
    hieradataurl: https://gitea.obmondo.com/EnableIT/linuxaid-config-7ejidqmfi9.git

postgresql:
  instance: 1
  size: 8Gi
  recover: false
  resources:
    limits:
      memory: 1200Mi
    requests:
      memory: 1000Mi
      cpu: 200m
