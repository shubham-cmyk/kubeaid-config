apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsmondo
  namespace: argocd
spec:
  sources:
  - repoURL: https://gitea.obmondo.com/EnableIT/opsmondo.git
    targetRevision: HEAD
    path: helm/opsmondo
  - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
    targetRevision: HEAD
    path: k8s/kbm.obmondo.com/argocd-apps
    helm:
      valueFiles:
      - values-opsmondo.yaml
  destination:
    namespace: monitoring
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated: null
    syncOptions:
    - ApplyOutOfSyncOnly=true
