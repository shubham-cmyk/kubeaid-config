apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obmondo-uiwork
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-uiwork
  project: default
  source:
    path: helm/obmondo-uiwork
    repoURL: https://gitlab.enableit.dk/obmondo/uiwork.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kbm.obmondo.com/argocd-apps/values-obmondo-uiwork.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
