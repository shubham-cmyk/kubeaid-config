apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obmondo-pushupdate
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: obmondo-pushupdate
  project: default
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/pushupdate.git
      path: build/helm
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kbm.obmondo.com/argocd-apps/values-pushupdate.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
