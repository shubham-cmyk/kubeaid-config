apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8id-pushupdate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: obmondo
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    - repoURL: https://gitea.obmondo.com/EnableIT/kubernetes-config-enableit.git
      path: argocd-helm-charts/k8id-pushupdate
      targetRevision: HEAD
      helm:
        ignoreMissingValueFiles: true
        valueFiles:
          - values.yaml
          - ../../k8s/kbm.obmondo.com/argocd-apps/values-k8id-pushupdate.yaml
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
