apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: puppetserver-ebillet
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: puppetserver-ebillet
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/KubeAid.git
      path: argocd-helm-charts/puppetserver
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kbm.obmondo.com/argocd-apps/values-puppetserver-ebillet.yaml
          - $values/k8s/kbm.obmondo.com/argocd-apps/values-puppetserver-common.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
