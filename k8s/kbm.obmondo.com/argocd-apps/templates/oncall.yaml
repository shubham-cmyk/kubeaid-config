apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oncall
  namespace: argocd
spec:
  destination:
    namespace: oncall
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argocd-helm-charts/oncall
    repoURL: https://gitlab.enableit.dk/kubernetes/k8id.git
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
      - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kbm.obmondo.com/argocd-apps/values-oncall.yaml
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
