---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kcm-capi-hetzner
  namespace: argocd
spec:
  destination:
    namespace: caph-system
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/KubeAid.git
      path: argocd-helm-charts/capi-hetzner
      targetRevision: hetzner_cluster_api
      helm:
        valueFiles:
          - $values/k8s/kbm.obmondo.com/argocd-apps/values-kcm-capi-hetzner.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: hetzner_ccm
      ref: values
  project: default
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
