apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-staging
  namespace: argocd
spec:
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/KubeAid.git
      path: argocd-helm-charts/gitea
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kbm.obmondo.com/argocd-apps/values-gitea-staging.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  destination:
    namespace: monitoring-staging
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated: null
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
