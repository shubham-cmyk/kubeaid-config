apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: system
  project: default
  source:
    path: argocd-helm-charts/gatekeeper
    repoURL: https://gitlab.enableit.dk/kubernetes/k8id.git
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
      - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kbm.obmondo.com/argocd-apps/values-gatekeeper.yaml
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
