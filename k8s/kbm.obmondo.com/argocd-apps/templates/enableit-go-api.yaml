apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enableit-go-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: obmondo
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: argocd-helm-charts/enableit-go-api
    repoURL: https://gitlab.enableit.dk/kubernetes/kubernetes-config-enableit.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kbm.obmondo.com/argocd-apps/values-enableit-go-api.yaml
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
