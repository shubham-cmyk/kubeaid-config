apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enableit-api
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: enableit-api
  project: default
  source:
    path: helm/enableit-api
    repoURL: https://gitlab.enableit.dk/enableit/enableit-api.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kbm.obmondo.com/argocd-apps/values-enableit-api.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
