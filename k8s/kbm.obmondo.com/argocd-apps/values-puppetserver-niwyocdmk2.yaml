customerid: niwyocdmk2
puppetserver:
  storage:
    storageClass: rook-ceph-block
  accessModes:
    - ReadOnlyMany
  global:
    extraEnv:
      OBMONDO_ENV: "beta"
  puppetserver:
    masters:
      fqdns:
        alternateServerNames: niwyocdmk2.puppet.obmondo.com
  r10k:
    hiera:
      extraRepository:
        niwyocdmk2:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-niwyocdmk2.git
          basedir: /etc/puppetlabs/code/hiera-data/niwyocdmk2
  puppetdb:
    fqdns:
      alternateServerNames: niwyocdmk2.puppetdb.obmondo.com

postgresql:
  instance: 1
  size: 2Gi
  recover: false
  resources:
    limits:
      memory: 500Mi
    requests:
      memory: 500Mi
      cpu: 200m
