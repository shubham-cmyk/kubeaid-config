namespace: obmondo-website
image:
  tag: latest
  pullPolicy: Always
api:
  website: https://beta.kbm.obmondo.com
  domain: beta.kbm.obmondo.com
ingress:
  hosts:
    - host: beta.kbm.obmondo.com
      paths:
        - path: /api
          pathType: ImplementationSpecific
  tls:
    - secretName: beta-kbm-obmondo-com-tls
      hosts:
        - beta.kbm.obmondo.com
  annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.options: mtls
