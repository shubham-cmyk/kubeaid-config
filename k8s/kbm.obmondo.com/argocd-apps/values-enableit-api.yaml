masters:
  - "klavs@obmondo.com"
  - "ashish@obmondo.com"
internalIpRanges:
  - 172.20.0.0/16
trustedProxies:
  - 10.96.0.0/12
image:
  pullPolicy: Always
api:
  website: https://api-beta.obmondo.com
  domain: api-beta.obmondo.com
  puppetdb:
    url: 'http://puppet.enableit.dk:58080'
  puppetserver:
    url: 'https://puppet.enableit.dk'
  mattermost:
    channel: testing
  chat:
    teamid: iu94xkqsgjgj5ne4eeie1harcr
    userid: dpg87od6hpy5zpnhjw99qhbw3r
persistence:
  enabled: true
ci:
  enabled: false
pgdump:
  enabled: false
ingress:
  hosts:
    - host: api-beta.obmondo.com
      paths:
        - path: /api/ping
          pathType: Prefix
          servicePort: 8080
        - path: /api/notify
          pathType: Prefix
          servicePort: 8080
        - path: /api/window
          pathType: Prefix
          servicePort: 8080
        - path: /api/tag
          pathType: Prefix
          servicePort: 8080
        - path: /api/user-location
          pathType: Prefix
          servicePort: 8080
        - path: /swagger/go
          pathType: Prefix
          servicePort: 8080
        - path: /api/timereg
          pathType: Prefix
          servicePort: 8080
        - path: /api/report/error
          pathType: Prefix
          servicePort: 8080
        - path: /api/invoice/
          pathType: Prefix
          servicePort: 8080
        - path: /Webtee
          pathType: Prefix
          servicePort: 8100
        - path: /
          pathType: ImplementationSpecific
          servicePort: 8088
  tls:
    - secretName: api-beta-obmondo-com-tls
      hosts:
        - api-beta.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd

postgresql:
  instance: 2
  logicalBackup:
    enabled: false

serviceMonitor:
  enabled: false
