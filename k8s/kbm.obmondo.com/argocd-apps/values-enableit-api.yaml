# API ports guide for ingress
# This section defines the servicePort used by different language APIs in our environments.
# - Port 8080: Used by Go API
# - Port 8088: Used by Clojure API
# - Port 8100: Used by Webtee
# KBM uses the Go API by default
ingress:
  hosts:
    - host: api-beta.obmondo.com
      paths:
        - path: /api/servers/puppet
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/ping-and-get-noop
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/statistics/os/customer/
          pathType: Prefix
          servicePort: 8080
        - path: /api/ping
          pathType: Prefix
          servicePort: 8080
        - path: /api/notify
          pathType: Prefix
          servicePort: 8080
        - path: /api/window
          pathType: Prefix
          servicePort: 8080
        - path: /api/tag
          pathType: Prefix
          servicePort: 8080
        - path: /api/user-location
          pathType: Prefix
          servicePort: 8080
        - path: /swagger/go
          pathType: Prefix
          servicePort: 8080
        - path: /api/timereg
          pathType: Prefix
          servicePort: 8080
        - path: /api/report/error
          pathType: Prefix
          servicePort: 8080
        - path: /api/invoice/
          pathType: Prefix
          servicePort: 8080
        - path: /api/subscription_transactions
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/tags
          pathType: Prefix
          servicePort: 8088
        - path: /api/servers/csv/customer
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/customer
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/cve_details
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/facts
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/install-link
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/install
          pathType: Prefix
          servicePort: 8080
        - path: /api/customer_details
          pathType: Prefix
          servicePort: 8080
        - path: /api/count
          pathType: Prefix
          servicePort: 8080
        - path: /api/feature
          pathType: Prefix
          servicePort: 8080
        - path: /api/config
          pathType: Prefix
          servicePort: 8080
        - path: /api/v2/subscriptions
          pathType: Exact
          servicePort: 8080
        - path: /api/orders
          pathType: Prefix
          servicePort: 8080
        - path: /Webtee
          pathType: Prefix
          serviceName: enableit-api-grpc
          servicePort: 8100
        - path: /api/webhook/gitea
          pathType: Exact
          servicePort: 8080
        - path: /
          pathType: ImplementationSpecific
          servicePort: 8088
        - path: /api/v1/users
          pathType: Prefix
          servicePort: 8080

  tls:
    - secretName: api-beta-obmondo-com-tls
      hosts:
        - api-beta.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd

postgresql:
  instance: 2
  logicalBackup:
    enabled: false

serviceMonitor:
  enabled: true

extraEnv:
  - name: PUPPET_API
    value: http://puppet.enableit.dk:58080
  - name: PUPPET_TIMEOUT
    value: 30
  - name: DELETION_OF_TAG_BASED_WINDOWS_ALLOWED
    value: true
  - name: CONFIG_REPOS_PATH
    value: /opt/obmondo/repos
  - name: PUPPET_PKCS7_CERT_PATH
    value: /opt/obmondo/puppet-pkcs7-cert.pem
  - name: ACCESS_LIST_CERTNAMES
    value: "internal-api01.enableit,opsmondo-test.niwyocdmk2,k8s-htzhel1-kbm.enableit,financeapi-puppet-cert.enableit,finance-api-beta-service.enableit"

