# API ports guide for ingress
# This section defines the servicePort used by different language APIs in our environments.
# - Port 8080: Used by Go API
# - Port 8088: Used by Clojure API
# - Port 8100: Used by Webtee
# KBM uses the Go API by default
ingress:
  hosts:
    - host: api-beta.obmondo.com
      paths:
        - path: /api/servers/ping-and-get-noop
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/tags
          pathType: Prefix
          servicePort: 8088
        - path: /Webtee
          pathType: Prefix
          serviceName: enableit-api-grpc
          servicePort: 8100
        - path: /api/subscription
          pathType: Prefix
          servicePort: 8088
        - path: /api/feature
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/csv/customer
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/customer
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/cve_details
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/facts
          pathType: Prefix
          servicePort: 8080
        - path: /api/server
          pathType: Prefix
          servicePort: 8088
        - path: /api/customer
          pathType: Prefix
          servicePort: 8088
        - path: /api/customer_details
          pathType: Prefix
          servicePort: 8080
        - path: /api/count
          pathType: Prefix
          servicePort: 8080
        - path: /api/order
          pathType: Prefix
          servicePort: 8088
        - path: /api/puppet
          pathType: Prefix
          servicePort: 8088
        - path: /api/invoice-pdf
          pathType: Prefix
          servicePort: 8088
        - path: /api/data
          pathType: Prefix
          servicePort: 8088
        - path: /api/contact
          pathType: Prefix
          servicePort: 8088
        - path: /api/job
          pathType: Prefix
          servicePort: 8088
        - path: /api/products
          pathType: Prefix
          servicePort: 8088
        - path: /api/customers
          pathType: Prefix
          servicePort: 8088
        - path: /api/mail-invoices
          pathType: Prefix
          servicePort: 8088
        - path: /api/feedback
          pathType: Prefix
          servicePort: 8088
        - path: /api/facts
          pathType: Prefix
          servicePort: 8088
        - path: /api/user/
          pathType: Prefix
          servicePort: 8088
        - path: /api/users
          pathType: Prefix
          servicePort: 8088
        - path: /api/clusters
          pathType: Prefix
          servicePort: 8088
        - path: /api/cluster
          pathType: Prefix
          servicePort: 8088
        - path: /api/auth
          pathType: Prefix
          servicePort: 8088
        - path: /api/contacts
          pathType: Prefix
          servicePort: 8088
        - path: /api/invoice-data
          pathType: Prefix
          servicePort: 8088
        - path: /api/webhook/gitea
          pathType: Prefix
          servicePort: 8080
        - path: /
          pathType: ImplementationSpecific
          servicePort: 8080
  tls:
    - secretName: api-beta-obmondo-com-tls
      hosts:
        - api-beta.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd

postgresql:
  instance: 2
  logicalBackup:
    enabled: false

serviceMonitor:
  enabled: false

extraEnv:
  - name: PUPPET_API
    value: http://puppet.enableit.dk:58080
  - name: PUPPET_TIMEOUT
    value: 30
  - name: DELETION_OF_TAG_BASED_WINDOWS_ALLOWED
    value: true
