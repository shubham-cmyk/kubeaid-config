namespace: obmondo-website
trustedProxies:
  - 10.96.0.0/12
admins:
  - "klavs@obmondo.com"
  - "ashish@obmondo.com"
  - "aman@obmondo.com"
  - "emilhp@obmondo.com"
  - "deepak@obmondo.com"
