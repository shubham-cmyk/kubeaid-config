relate:
  image:
    registry: harbor.obmondo.com
    pullPolicy: Always
    pullSecret: gitlab.dk-dockerfiles-pullsecrets

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi

  ## Environment variables - db user+pass loaded from secret
  environment:
    - name: SMTPHOST
      value: 'mail.system'
    - name: SMTPPORT
      value: '587'
    - name: DBHOST
      value: 'relate-pgsql-rw'
    - name: DBUSER
      valueFrom:
        secretKeyRef:
          name: relate-pgsql-app
          key: username
    - name: DBPASS
      valueFrom:
        secretKeyRef:
          name: relate-pgsql-app
          key: password

  ingress:
    enabled: true
    hostname: relate.kbm.obmondo.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
    tls: true
    extraHosts:
      - name: relate.obmondo.com
        path: /
