oncall:
  base_url: oncall.kbm.obmondo.com
  image:
    tag: v1.3.20
  externalGrafana:
    url: https://grafana.kbm.obmondo.com
  oncall:
    telegram:
      enabled: true
      webhookUrl: https://oncall.kbm.obmondo.com
      existingSecret: telegram-bot-token
      tokenKey: telegram-token
  ingress:
    enabled: true
    className: traefik-cert-manager
    annotations:
      kubernetes.io/ingress.class: traefik-cert-manager
      cert-manager.io/cluster-issuer: letsencrypt
  backup:
    cloud: "aws"
    destinationPath: https://s3.obmondo.com/kbm-oncall-postgres-backups
