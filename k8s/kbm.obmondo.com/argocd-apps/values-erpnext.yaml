erpnext:
  jobs:
    createSite:
      enabled: true
      siteName: "erp.obmondo.com"
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
    hosts:
    - host: erp.obmondo.com
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: erp.obmondo.com-tls
      hosts:
        - erp.obmondo.com
