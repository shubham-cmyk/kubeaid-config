apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 9.5.3
  name: grafana-config
  namespace: monitoring
stringData:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    [auth]
    disable_login_form = false
    disable_signout_menu = false
    signout_redirect_url = https://keycloakx.kam.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/logout?post_logout_redirect_uri=https://grafana.kbm.obmondo.com/login&client_id=grafana
    [auth.generic_oauth]
    allow_sign_up = true
    api_url = https://keycloakx.kam.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/userinfo
    auth_url = https://keycloakx.kam.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/auth
    client_id = grafana
    email_attribute_path = email
    enabled = true
    groups_attribute_path = groups
    login_attribute_path = username
    name = Keycloak
    name_attribute_path = full_name
    role_attribute_path = contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || 'Viewer'
    scopes = openid email profile offline_access roles
    token_url = https://keycloakx.kam.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/token
    [date_formats]
    default_timezone = UTC
    [server]
    root_url = https://grafana.kbm.obmondo.com
type: Opaque
