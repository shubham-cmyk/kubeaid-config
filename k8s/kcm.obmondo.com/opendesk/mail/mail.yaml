      serviceAccountName: opendesk-dkimpy-milter
      containers:
        - name: "dkimpy-milter"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seLinuxOptions: null
            seccompProfile:
              type: RuntimeDefault
          image: "registry.opencode.de/bmi/opendesk/components/platform-development/images/dkimpy-milter:1.1.0@sha256:f140c7fc3fd9636addc612edd6e10f6aefa69e34ff637c95ce9036a32e44555f"
          imagePullPolicy: IfNotPresent
          command:
            - "/usr/bin/dkimpy-milter"
            - "/etc/dkimpy-milter/dkimpy-milter.conf"
          env:
          livenessProbe:
            tcpSocket:
              port: 8892
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 8892
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
            successThreshold: 1
          ports:
            - name: dkimpy
              containerPort: 8892
              protocol: TCP
          resources:
            limits:
              cpu: 99
              memory: 256Mi
            requests:
              cpu: 0.1
              memory: 128Mi
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
            - name: "run"
              mountPath: "/var/run/dkimpy-milter"
            - name: "config"
              mountPath: "/etc/dkimpy-milter/dkimpy-milter.conf"
              subPath: "dkimpy-milter.conf"
            - name: "dkim-key"
              mountPath: "/usr/local/etc/mail/dkim.key"
              subPath: "dkim.key"
      volumes:
        - name: "tmp"
          emptyDir:
            medium: "Memory"
            sizeLimit: "1Mi"
        - name: "run"
          emptyDir:
            medium: "Memory"
            sizeLimit: "1Mi"
        - name: "config"
          configMap:
            name: opendesk-dkimpy-milter
            items:
              - key: "dkimpy-milter.conf"
                path: "dkimpy-milter.conf"
        - name: "dkim-key"
          secret:
            secretName: "opendesk-dkimpy-milter"
            items:
              - key: "dkim.key"
                path: "dkim.key"
