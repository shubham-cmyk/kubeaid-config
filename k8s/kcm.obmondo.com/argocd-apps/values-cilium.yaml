---
cilium:
  kubeProxyReplacement: 'true'
  k8sServiceHost: 65.108.70.52
  k8sServicePort: 6443
  extraArgs: ['--devices=eth0,enp+,eno+']
  policyAuditMode: true
  hubble:
    export:
      dynamic:
        enabled: true
        config:
          createConfigMap: true
          configMapName: cilium-flowlog-config
          content:
            - name: audited
              filePath: /var/run/cilium/hubble/audited.log
              includeFilters:
                - verdict:
                    - AUDIT
              fileMaxSizeMb: 50
              fileMaxBackups: 20
              fileCompress: true
            - name: dropped
              filePath: /var/run/cilium/hubble/dropped.log
              includeFilters:
                - verdict:
                    - DROPPED
              fileMaxSizeMb: 50
              fileMaxBackups: 20
              fileCompress: true

  # With full-coverage socket LB, ClusterIP translation only happens at
  # connect() — packets FORWARDED by a pod (the netbird-operator's
  # NetworkRouter routing mesh traffic to 10.96.0.1) never touch a
  # socket, leave still addressed to the VIP, and blackhole. Hostns-only
  # scopes socket LB to the host namespace so pod traffic (including
  # forwarded flows) gets per-packet service translation instead.
  socketLB:
    hostNamespaceOnly: true
