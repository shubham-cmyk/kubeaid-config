---
global:
  netpol:
    enabled: true
    traefik:
      namespace: traefik
      labels:
        "k8s:app.kubernetes.io/name": traefik
        "k8s:app.kubernetes.io/instance": traefik
    prometheus:
      namespace: monitoring
      labels:
        "k8s:app.kubernetes.io/name": prometheus

  blackbox:
    enabled: true
    interval: 30m
    url:
      - https://argocd.kcm.obmondo.com

  argocd:
    netpol: true
    namespace: argocd
    endpointSelectorLabels:
      app.kubernetes.io/part-of: argocd
    kubeaidAgent:
      namespace: monitoring
      labels:
        "k8s:app.kubernetes.io/name": kubeaid-agent
    blackboxExporter:
      enabled: true
      namespace: monitoring
      labels:
        "k8s:app.kubernetes.io/name": blackbox-exporter
    gitFQDNs:
      - gitea.obmondo.com
      - github.com
      - charts.rook.io
      - keycloak.obmondo.com

argo-cd:
  configs:
    secret:
      createSecret: false     # managed by sealed-secrets now
    params:
      server.insecure: true
    rbac:
      policy.csv: |
        p, role:kubeaid-apps, applications, get, kubeaid/*, allow
        p, role:kubeaid-apps, applications, list, kubeaid/*, allow
        p, role:kubeaid-apps, applications, sync, kubeaid/*, allow
        p, role:kubeaid-apps, applications, health, kubeaid/*, allow
        p, role:kubeaid-apps, applications, status, kubeaid/*, allow
        g, kubeaid-agent, role:kubeaid-apps
        g, ArgoCDAdmins, role:admin
        g, ArgoCDDevs, role:readonly
        g, deepak@obmondo.com, role:admin
        g, divyam@obmondo.com, role:admin
        g, rishikesh@obmondo.com, role:admin
        g, basit@obmondo.com, role:admin
        g, sanskar@obmondo.com, role:admin
        g, archisman@obmondo.com, role:admin
        g, bhavishya@obmondo.com, role:admin
        g, anantharam@obmondo.com, role:admin
        g, suwarna@obmondo.com, role:admin
        g, sgupta@obmondo.com, role:admin
        g, hritik@obmondo.com, role:admin
        g, sidharth@obmondo.com, role:admin
        g, kanha@obmondo.com, role:admin
        g, mdasif@obmondo.com, role:admin
        g, vitamax@obmondo.com, role:admin
        g, mayank@obmondo.com, role:admin
        g, victorine@obmondo.com, role:admin
        g, timothy@obmondo.com, role:admin
        g, esther@obmondo.com, role:admin
        g, olayinka@obmondo.com, role:admin
        g, francodavid@obmondo.com, role:admin
        g, smahar@obmondo.com, role:admin
        g, yulian@obmondo.com, role:admin
        g, nmalang@obmondo.com, role:admin
        g, deep@obmondo.com, role:admin
        g, onkar@obmondo.com, role:admin
        g, kenneth@obmondo.com, role:admin
        g, akshay@obmondo.com, role:admin
        g, mwarid@obmondo.com, role:admin
        g, shivam@obmondo.com, role:admin
        g, gaurav@obmondo.com, role:admin
        g, klaes@obmondo.com, role:admin
        g, rishi@obmondo.com, role:admin
        g, shubh@obmondo.com, role:admin
        g, lucas@obmondo.com, role:admin
        p, role:kubeaid-apps, applications, get, kubeaid/*, allow
        p, role:kubeaid-apps, applications, sync, kubeaid/*, allow
        p, role:kubeaid-apps, applications, health, kubeaid/*, allow
        p, role:kubeaid-apps, applications, status, kubeaid/*, allow
        g, kubeaid-agent, role:kubeaid-apps
      scopes: '[groups, email]'
    cm:
      accounts.kubeaid-agent: apiKey
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.obmondo.com/auth/realms/Obmondo
        clientID: argocd
        clientSecret: $oidc.keycloak.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
  server:
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 5m
        memory: 128Mi
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: traefik-cert-manager
        # necessary for bare-metal only - for unknown reason.
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
      - argocd.kcm.obmondo.com
      tls:
      - secretName: argocd-ssl
        hosts:
        - argocd.kcm.obmondo.com
      ingressClassName: traefik-cert-manager
  controller:
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.kcm.obmondo.com
