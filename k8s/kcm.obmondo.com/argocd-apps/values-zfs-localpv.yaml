zfs-localpv:
  zfsNode:
    nodeSelector:
      kubernetes.io/os: linux
      disk: nvme
    tolerations: []
    securityContext: {}
    labels: {}
    priorityClass:
      create: true
      name: zfs-csi-node-critical
  zfsController:
    nodeSelector:
      kubernetes.io/os: linux
      disk: nvme
    tolerations: []
    securityContext: {}
    priorityClass:
      create: true
      name: zfs-csi-controller-critical

storageClass:
  enabled: true
  poolName: primary
