global:
  blackbox:
    enabled: true
    interval: 30m
    url:
      - https://enableit.prometheus.obmondo.com
      - https://enableit.graphs.obmondo.com

prometheus:
  server: enableit.prometheus.obmondo.com
  customerid: "enableit"
  ingress:
    enabled: true
    domain: enableit.prometheus.obmondo.com
    ingressClassName: traefik-cert-manager
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.options: traefik-prometheus-puppet-agent-tls-auth@kubernetescrd
  storage:
    size: 130Gi
    className: ceph-filesystem
  resources:
    limits:
      memory: 6Gi
    requests:
      cpu: 200m
      memory: 4Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: traefik-cert-manager
    domain: enableit.graphs.obmondo.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-enableit-grafana-chain@kubernetescrd

middleware:
  jwt:
    headers:
      authentication: enableit
