customerid: enableit
puppetserver:
  puppetdb:
    fqdns:
      alternateServerNames: enableit.puppetdb.kcm.obmondo.com
    extraEnv:
      OPENVOXDB_POSTGRES_HOSTNAME: puppetserver-pgsql-rw
      OPENVOXDB_JAVA_ARGS: "-Xms256m -Xmx256m -XX:+HeapDumpOnOutOfMemoryError"
      CERTNAME: puppetdb
  puppetserver:
    masters:
      fqdns:
        alternateServerNames: enableit.puppet.kcm.obmondo.com
    persistence:
      data:
        size: 800Mi
  r10k:
    hiera:
      extraRepository:
        enableit:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-enableit.git
          basedir: /etc/puppetlabs/code/hiera-data/enableit
        niwyocdmk2:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-niwyocdmk2.git
          basedir: /etc/puppetlabs/code/hiera-data/niwyocdmk2
        p45k4z2vfh:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-p45k4z2vfh.git
          basedir: /etc/puppetlabs/code/hiera-data/p45k4z2vfh
        ebillet:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-ebillet.git
          basedir: /etc/puppetlabs/code/hiera-data/ebillet
        qd2xcggwag:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-qd2xcggwag.git
          basedir: /etc/puppetlabs/code/hiera-data/qd2xcggwag
        a0hu8x41ng:
          remote: https://gitea.obmondo.com/EnableIT/linuxaid-config-a0hu8x41ng.git
          basedir: /etc/puppetlabs/code/hiera-data/a0hu8x41ng

postgresql:
  instance: 1
  size: 2Gi
  recover: false
  resources:
    limits:
      memory: 500Mi
    requests:
      memory: 500Mi
      cpu: 200m
