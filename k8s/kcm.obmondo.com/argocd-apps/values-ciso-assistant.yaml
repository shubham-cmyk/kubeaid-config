---
global:
  blackbox:
    enabled: true
    probes:
      - module: http_2xx
        interval: 30m
        urls:
          - https://ciso.obmondo.com

ciso-assistant:
  global:
    domain: ciso.obmondo.com
  backend:
    config:
      smtp:
        host: mail.system
        port: 587
        useTls: false
        defaultFrom: no-reply@ciso.obmondo.com
  ingress:
    enabled: true
    tls:
      enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
      traefik.ingress.kubernetes.io/router.tls: 'true'
