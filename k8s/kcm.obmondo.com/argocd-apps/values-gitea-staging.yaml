global:
  blackbox:
    enabled: true
    probes:
      - module: http_2xx
        interval: 30m
        urls:
          - https://gitea-staging.kcm.obmondo.com

gitea:
  image:
    registry: harbor.obmondo.com
    repository: obmondo/gitea
    tag: v1.26.10-obmondo
    rootless: false
  imagePullSecrets:
    - name: harbor-registry-secret
  extraDeploy:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: gitea-bootstrap
        annotations:
          "helm.sh/hook": post-install
          "helm.sh/hook-delete-policy": hook-succeeded
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 1
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: gitea-bootstrap
                image: harbor.obmondo.com/obmondo/gitea-bootstrap:v1.0.10
                env:
                  - name: GITEA_URL
                    value: http://gitea-staging-http:3000
                  - name: GITEA_USERNAME
                    value: gitea_admin
                  - name: GITEA_PASSWORD
                    value: r8sA8CPHD9!bt6d
                  - name: POSTGRES_URI
                    valueFrom:
                      secretKeyRef:
                        name: gitea-staging-pgsql-app
                        key: uri
