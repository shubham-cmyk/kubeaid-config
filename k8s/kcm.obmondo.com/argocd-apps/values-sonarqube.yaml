sonarqube:
  ingress:
    enabled: true
    ingressClassName: traefik-cert-manager
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - name: sonarqube.kcm.obmondo.com
        path: /
    tls:
      - secretName: sonarqube-kcm-tls
        hosts:
          - sonarqube.kcm.obmondo.com
  serviceAccount:
    create: true
    name: sonarqube
  sonarProperties:
    sonar.core.serverBaseURL: "https://sonarqube.kcm.obmondo.com"
  jdbcOverwrite:
    enabled: true
    jdbcSecretName: sonarqube-pgsql-app
    jdbcSecretPasswordKey: password
    jdbcUrl: "jdbc:postgresql://sonarqube-pgsql-rw/sonarqube?socketTimeout=1500"
    jdbcUsername: sonarqube

global:
  blackbox:
    enabled: true
    interval: 30m
    url:
      - https://sonarqube.kcm.obmondo.com

  postgresql:
    enabled: true
    instanceName: sonarqube
    instances: 1
    size: 4Gi
    backups:
      enabled: true
      destinationPath: "s3://kcm-sonarqube"
      endpointURL: "https://s3.obmondo.com"
      cloud: "aws"
    monitoring:
      enablePodMonitor: false

networkpolicies: false
