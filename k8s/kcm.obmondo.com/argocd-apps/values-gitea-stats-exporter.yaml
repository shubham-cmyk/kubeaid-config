global:
  blackbox:
    enabled: true
    interval: 30m
    url:
      - https://gitea-stats.kcm.obmondo.com

ingress:
  enabled: true
  hosts:
    - host: gitea-stats.kcm.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: gitea-stats-tls
      hosts:
        - gitea-stats.kcm.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
