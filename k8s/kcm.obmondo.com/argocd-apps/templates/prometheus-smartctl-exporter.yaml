apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-smartctl-exporter
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  project: default
  source:
    repoURL: https://gitea.obmondo.com/EnableIT/Kubeaid.git
    path: argocd-helm-charts/smartmon-exporter
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
