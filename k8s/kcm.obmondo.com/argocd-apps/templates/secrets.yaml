apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: HEAD
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
  name: secrets
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  project: kubeaid
  source:
    path: k8s/kcm.obmondo.com/sealed-secrets
    repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit
    targetRevision: HEAD
    directory:
      recurse: true
