apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opendesk-essentials
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: opendesk
  project: kubeaid
  source:
    path: k8s/kcm.obmondo.com/opendesk-essentials
    repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
    targetRevision: opendesk
    directory:
      recurse: true
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
---
