apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linuxaid-web-app
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-website
  project: default
  sources:
    - repoURL: 'https://gitea.obmondo.com/EnableIT/obmondo-web-app.git'
      path: .helm/web-app
      targetRevision: add/cilium
      helm:
        valueFiles:
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-linuxaid-web-app.yaml
    - repoURL: 'https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git'
      targetRevision: add/web-apps
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
