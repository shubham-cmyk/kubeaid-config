apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup-exporter
  namespace: argocd
spec:
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/backup-exporter.git
      path: dist/chart
      targetRevision: v1.0.0
      helm:
        valueFiles:
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-backup-exporter.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  destination:
    namespace: monitoring
    server: 'https://kubernetes.default.svc'
  project: kubeaid
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
