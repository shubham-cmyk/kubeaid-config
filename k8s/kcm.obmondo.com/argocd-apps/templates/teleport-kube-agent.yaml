apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: 13.0.0
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
  name: teleport-kube-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: obmondo
  project: default
  sources:
    - repoURL: https://github.com/Obmondo/KubeAid
      path: argocd-helm-charts/teleport-kube-agent
      targetRevision: 13.0.0
      helm:
        valueFiles:
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-teleport-kube-agent.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true

