apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obmondo-k8s-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    kubeaid.io/version: HEAD
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo
  project: default
  source:
    path: argocd-helm-charts/obmondo-k8s-agent
    repoURL: https://gitea.obmondo.com/EnableIT/KubeAid.git
    targetRevision: HEAD
    helm:
      valueFiles:
      - values.yaml
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
