apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: puppetserver-enableit
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: puppetserver-enableit
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/KubeAid.git
      path: argocd-helm-charts/openvox
      targetRevision: 20.1.1
      helm:
        valueFiles:
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-puppetserver-common.yaml
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-puppetserver-enableit.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  project: kubeaid
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
