apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-oncall
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: test-oncall
  project: kubeaid
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid.git
      path: argocd-helm-charts/oncall
      targetRevision: oncall-netpol
      helm:
        valueFiles:
          - $values/k8s/kcm.obmondo.com/argocd-apps/values-oncall.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: test-oncall
      ref: values
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true