global:
  blackbox:
    enabled: true
    probes:
      - module: http_2xx
        interval: 30m
        urls:
          - https://vuls.obmondo.com

ingress:
  enabled: true
  className: traefik-cert-manager
  annotations:
    kubernetes.io/ingress.class: traefik-cert-manager
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: vuls.obmondo.com
      paths:
        - path: /goval-dictionary
          pathType: Prefix
          servicePort: 1324
        - path: /go-cve-dictionary
          pathType: Prefix
          servicePort: 1323
  vulsServer:
    enabled: true
    hosts:
      - host: vuls.obmondo.com
        paths:
          - path: /vuls
            pathType: Prefix
  tls:
    - secretName: vuls-tls
      hosts:
        - vuls.obmondo.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

vulsExporter:
  enabled: true
  obmondo:
    url: https://api.obmondo.com
  tls:
    secretName: vuls-clientcert

vulsServer:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  resultsStorage:
    size: 15Gi
