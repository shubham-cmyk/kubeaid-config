---
keycloakx:
  dbchecker:
    enabled: true
  database:
    hostname: keycloak-pgsql-rw
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.tls: "true"
      kubernetes.io/ingress.class: traefik-cert-manager
    rules:
      - host: keycloak-staging.kcm.obmondo.com
        paths:
          - path: /
            pathType: Prefix

global:
  postgresql:
    enabled: true
    instanceName: keycloak
    instances: 1
    size: 8Gi
    storageClass: rook-ceph-block
    backups:
      enabled: false
    monitoring:
      enablePodMonitor: false
blackbox:
  probe: false
