matomo:
  matomoUsername: admin
  matomoEmail: info@obmondo.com
  mariadb:
    enabled: false
  externalDatabase:
    host: matomo-mariadb
    port: 3306
    user: matomo
    database: matomo-mariadb
    existingSecret: mariadb-secret     # make sure in the secret the key is db-password in mariadb template
  ingress:
    ingressClassName: traefik-cert-manager
    enabled: true
    hostname: matomo.kcm.obmondo.com
    path: /
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
    tls: true
  pdb:
    create: false

mariadb:
  rootPasswordSecretKeyRef:
    name: mariadb-secret
    key: MARIADB_ROOT_PASSWORD
    generate: false
  storage:
    size: 3Gi
  username: matomo
  passwordSecretKeyRef:
    name: mariadb-secret
    key: db-password
    generate: false
  database: matomo-mariadb
  logicalbackup:
    enabled: true
    s3bucket: "kcm-matomo"
    provider: "s3"
    s3endpoint: "https://s3.obmondo.com"
    retention: "15 days"
