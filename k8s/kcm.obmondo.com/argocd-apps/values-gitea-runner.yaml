act-runner:
  replicaCount: 1
  act_runner:
    existingToken: gitea-runner-token
    storageclass: zfs-localpv
    storage:
      size: 140Gi
    instance: "https://gitea.obmondo.com"
    parallel_jobs: 30
    labels:
      # upstream link: https://hub.docker.com/r/gitea/gitea
      - "gitea:docker://harbor.obmondo.com/obmondo/gitea:v1.25.51-obmondo"
      - "ubuntu-latest:docker://harbor.obmondo.com/obmondo/catthehacker-ubuntu:act-24.04"
      - "ubuntu-24.04:docker://harbor.obmondo.com/obmondo/catthehacker-ubuntu:act-24.04"
      - "ubuntu-22.04:docker://harbor.obmondo.com/obmondo/catthehacker-ubuntu:act-22.04"
    registrySecretName: harbor-registry-secret
    registrySecretMountPath: /runner/.docker

runner:
  nameSpace:
    create: true
    name: obmondo-gitea-ci
  serviceAccount:
    create: true
    name: obmondo-gitea-ci
