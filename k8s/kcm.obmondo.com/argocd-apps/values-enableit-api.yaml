        - path: /api/invoice/
          pathType: Prefix
          servicePort: 8080
        - path: /api/subscription_transactions
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/tags
          pathType: Prefix
          servicePort: 8088
        - path: /api/servers/csv/customer
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/environment
