          servicePort: 8080
        - path: /api/customer/puppetserver
          pathType: Prefix
          servicePort: 8080
        - path: /api/customer/grafana
          pathType: Prefix
          servicePort: 8080
        - path: /api/leave
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/puppet
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/ping-and-get-noop
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/statistics/os/customer/
          pathType: Prefix
          servicePort: 8080
        - path: /api/ping
