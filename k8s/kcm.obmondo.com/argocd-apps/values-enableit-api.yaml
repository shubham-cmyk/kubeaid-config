# API ports guide for ingress
# This section defines the servicePort used by different language APIs in our environments.
# - Port 8080: Used by Go API
# - Port 8088: Used by Clojure API
# - Port 8100: Used by Webtee
# KBM uses the Go API by default
ingress:
  hosts:
    - host: api-beta.obmondo.com
      paths:
        - path: /api/customer/issues
          pathType: Prefix
          servicePort: 8080
        - path: /api/customer/billing
          pathType: Prefix
          servicePort: 8080
        - path: /api/customer/settings
          pathType: Prefix
          servicePort: 8080
        - path: /api/products
          pathType: Prefix
          servicePort: 8080
        - path: /api/instance_counts/certname
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/cve-report
