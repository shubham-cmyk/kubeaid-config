harbor:
  expose:
    tls:
      certSource: secret
      secret:
        secretName: harbor-ingress-tls
    ingress:
      hosts:
        core: harbor.kbm.obmondo.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        kubernetes.io/ingress.class: traefik
  externalURL: https://harbor.kbm.obmondo.com
  core:
    existingSecret: harbor-core-custom
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      timeoutSeconds: 5
    secretName: harbor-core-custom
    existingXsrfSecret: harbor-core-custom
    extraEnvVars:
      - name: CONFIG_OVERWRITE_JSON
        valueFrom:
          secretKeyRef:
            name: harbor-core-custom
            key: oidc-config
  jobservice:
    existingSecret: harbor-core-custom
  registry:
    existingSecret: harbor-core-custom
    credentials:
      existingSecret: harbor-core-custom
  persistence:
    persistentVolumeClaim:
      registry:
        size: 270Gi
        storageClass: rook-ceph-block
      jobservice:
        jobLog:
          size: 3Gi
          # rook-ceph-block (not node-local zfs) so the pod isn't pinned to a
          # control-plane nvme node and can schedule on any worker.
          storageClass: rook-ceph-block

postgres:
  size: 6Gi
  backup:
    enabled: true
    schedule: "30 00 * * *"
    s3bucket: "kbm-postgres-logical-backup"
    s3bucketscopesuffix: "harbor"
    provider: "s3"
    s3endpoint: "https://s3.obmondo.com"
    retention: "30"

global:
  blackbox:
    enabled: true
    probes:
      - module: http_2xx
        interval: 30m
        urls:
          - https://harbor.kbm.obmondo.com
  postgresql:
    enabled: true
    instanceName: harbor
    # cluster is harbor-pgsql (matches chart's hardcoded refs) but the database
    # stays registry (harbor's coreDatabase), owner harbor — same as KAM.
    database: registry
    owner: harbor
    size: 6Gi
    monitoring:
      enablePodMonitor: false
