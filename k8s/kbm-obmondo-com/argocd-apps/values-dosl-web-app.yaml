replicaCount: 1
# kbm runs Cilium, not Calico -> chart's projectcalico.org/v3 NetworkPolicy
# has no API to apply against. Disable it here.
networkPolicy: false
image:
  tag: v1.1.3
  pullPolicy: Always
ingress:
  ingressClassName: traefik
  hosts:
    - host: dosl.dk
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.dosl.dk
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: dosl-dk-tls
      hosts:
        - dosl.dk
        - www.dosl.dk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
