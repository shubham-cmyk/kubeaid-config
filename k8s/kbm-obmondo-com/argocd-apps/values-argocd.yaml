---
argo-cd:
  dex:
    enabled: false
  repoServer:
    replicas: 2
    autoscaling:
      enabled: false
  configs:
    secret:
      createSecret: false     # managed by sealed-secrets now
    ssh:
      extraHosts: |
        [gitea.obmondo.com]:2223 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFDZKKX5kDl8liLAp6+pkvzcbAODbJ9x2iZlBwUCedH0SiiFB8J8GFBnR/WwwL57tUTtMv+bdvSPx4HyAPIc7e4=
    params:
      server.insecure: true
    rbac:
      policy.csv: |
        p, role:kubeaid-apps, applications, get, kubeaid/*, allow
        p, role:kubeaid-apps, applications, list, kubeaid/*, allow
        p, role:kubeaid-apps, applications, sync, kubeaid/*, allow
        p, role:kubeaid-apps, applications, health, kubeaid/*, allow
        p, role:kubeaid-apps, applications, status, kubeaid/*, allow
        g, kubeaid-agent, role:kubeaid-apps
        g, ArgoCDAdmins, role:admin
        g, ArgoCDDevs, role:readonly
      scopes: '[groups, email]'
    cm:
      accounts.kubeaid-agent: apiKey
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.vpn.obmondo.com/auth/realms/obmondo
        clientID: argocd
        clientSecret: $oidc.keycloak.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod          # DNS-01 (mesh-only ⇒ no HTTP-01)
        # mesh-only: bind to the internal entrypoint, off the public web/websecure (LB) path
        traefik.ingress.kubernetes.io/router.entrypoints: websecure-internal
      hosts:
      - argocd.kbm.obmondo.com
      tls:
      - secretName: argocd-ssl
        hosts:
        - argocd.kbm.obmondo.com
  global:
    domain: argocd.kbm.obmondo.com
  controller:
    resources:
      requests:
        memory: 800Mi
      limits:
        memory: 1250Mi
