cloudnative-pg:
  monitoring:
    podMonitorEnabled: true
    prometheusRule:
      enabled: true
      labels:
        prometheus: k8s
      backupMaxAgeSeconds: 90000  # 24 hours + 1 hour as threhold
      walArchiveMaxAgeSeconds: 600
      firstRecoverabilityPointMaxAgeSeconds: 2700000 # 31 days (default retention is 30d (2592000 seconds) + 1d extra as threshold)
