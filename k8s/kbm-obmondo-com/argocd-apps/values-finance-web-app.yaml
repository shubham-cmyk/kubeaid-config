replicaCount: 1
image:
  tag: finance-v5.2.7
  pullPolicy: Always
ingress:
  className: traefik
  hosts:
    - host: finance.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: finance-obmondo-com-tls
      hosts:
        - finance.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
