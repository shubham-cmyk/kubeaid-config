apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  labels:
    kubeaid.io/version: 30.0.0
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: openobserve
  project: kubeaid
  sources:
    - repoURL: https://github.com/Obmondo/KubeAid.git
      path: argocd-helm-charts/opentelemetry-operator
      targetRevision: 30.0.0
      helm:
        valueFiles:
          - $values/k8s/kbm-obmondo-com/argocd-apps/values-opentelemetry-operator.yaml
    - repoURL: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
