apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsmondo
  namespace: argocd
spec:
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/opsmondo.git
      path: helm/opsmondo
      targetRevision: v1.7.0
      helm:
        valueFiles:
          - $values/k8s/kbm-obmondo-com/argocd-apps/values-opsmondo.yaml
    - repoURL: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  destination:
    namespace: monitoring
    server: 'https://kubernetes.default.svc'
  project: kubeaid
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
