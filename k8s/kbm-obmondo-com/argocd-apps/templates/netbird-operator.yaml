apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: 30.0.0
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
    kubeaid.io/priority: default
  name: netbird-operator
  namespace: argocd
spec:
  destination:
    namespace: netbird
    server: https://kubernetes.default.svc
  project: kubeaid
  sources:
    - repoURL: https://github.com/Obmondo/KubeAid.git
      path: argocd-helm-charts/netbird-operator
      targetRevision: 30.0.0
      helm:
        valueFiles:
          - $values/k8s/kbm-obmondo-com/argocd-apps/values-netbird-operator.yaml
    - repoURL: ssh://git@gitea.obmondo.com:2223/EnableIT/kubeaid-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
