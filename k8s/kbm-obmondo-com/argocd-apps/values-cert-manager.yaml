cert-manager:
  prometheus:
    enabled: false
issuer:
  enabled: true
  name: letsencrypt-prod
  issuerEmail: klavs@obmondo.com
  production: true
  secret: letsencrypt-prod-account-key
  preferredChain: ""
  solvers:
    - type: http
      http01:
        ingress:
          ingressClassName: traefik
    - type: dns
      cloudProvider: cloudflare
      issuerEmail: klavs@obmondo.com
      cloudProviderSecretRef:
        name: cloudflare-api-token
        key: api-token
      dnsZones:
        - kbm.obmondo.com
