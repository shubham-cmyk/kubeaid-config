rustfs:
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  storageclass:
    name: rook-ceph-block
    dataStorageSize: 10Gi
    logStorageSize: 10Gi
  secret:
    existingSecret: rustfs-secret
  config:
    rustfs:
      log_level: info
      region: us-east-1
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: rustfs.kbm.obmondo.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      certManager:
        enabled: true
