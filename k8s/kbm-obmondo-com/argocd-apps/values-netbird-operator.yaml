netbird-operator:
  managementURL: "https://netbird.vpn.obmondo.com"

# Mesh exposure of this cluster (NetworkRouter + NetworkResource,
# consumed by the netbird-operator wrapper chart). Declarative twin of
# the CRs first applied by hand from /tmp/kbm-netbird-network.yaml —
# same names, so ArgoCD adopts them in place on the first sync from a
# chart revision that renders these values.
networkRouter:
  enabled: true
  # Existing DNS zone in NetBird Mgmt; the router publishes each
  # exposed Service as a record under it.
  dnsZone: kbm.netbird
  replicas: 1

networkResources:
  # kube-apiserver over the mesh: routes the `kubernetes` Service
  # (10.96.0.1) and publishes it in the kbm.netbird zone. Mesh access
  # is granted by the Mgmt policy targeting the group below.
  - name: kube-api
    namespace: default
    service: kubernetes
    groups: ["k8s-kbm-obmondo-com"]
  - name: argocd
    namespace: argocd
    service: argocd-server
    groups: ["k8s-kbm-obmondo-com"]
