cluster:
    type: workload
    name: kbm-obmondo-com
    k8sVersion: v1.35.5
    enableAuditLogging: false
    apiServer:
        extraArgs: {}
        extraVolumes: []
        files: []
        oidc:
            issuerUrl: https://keycloak.vpn.obmondo.com/auth/realms/obmondo
            clientId: kubernetes-kbm-obmondo-com
    keycloak:
        mode: external
        dns: keycloak.vpn.obmondo.com
        realm: obmondo
    argoCD:
        deployKeys:
            kubeaidConfig:
                privateKeyFilePath: /tmp/ssh-priv
kubeaidStoragectl:
    version: v0.25.0
kubePrometheus:
    version: v0.17.0
cloud:
    hetzner:
        mode: bare-metal
        sshKeyPair:
            name: kbm-obmondo-com
            privateKeyFilePath: /tmp/ssh-priv
        bareMetal:
            wipeDisks: false
            installImage:
                imagePath: /root/.oldroot/nfs/images/Ubuntu-2604-resolute-amd64-base.tar.zst
                vg0:
                    size: 80
                    rootVolumeSize: 50
            vSwitch:
                name: kbm-obmondo-com-vswitch
                vlanID: 4000
                subnetCIDRBlock: "10.0.1.0/24"
            zfs:
                size: 220
        controlPlane:
            bareMetal:
                endpoint:
                    isFailoverIP: true
                    host: 95.216.30.44
                bareMetalHosts:
                    # Robot main IP: 135.181.21.167
                    - serverID: "1455726"
                      privateIP: 10.0.1.1
                    # Robot main IP: 135.181.21.154
                    - serverID: "1455733"
                      privateIP: 10.0.1.2
                    # Robot main IP: 135.181.21.153
                    - serverID: "1455734"
                      privateIP: 10.0.1.3
                zfs:
                    size: 220
            regions:
                - hel1
        nodeGroups:
            bareMetal:
                - name: workers
                  bareMetalHosts:
                    # Robot main IP: 135.181.223.235
                    - serverID: "1414813"
                      privateIP: 10.0.1.4
                    # Robot main IP: 65.21.130.86
                    - serverID: "1454837"
                      privateIP: 10.0.1.5
                    # Robot main IP: 65.21.130.85
