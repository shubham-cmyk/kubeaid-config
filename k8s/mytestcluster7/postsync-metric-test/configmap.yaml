apiVersion: v1
kind: ConfigMap
metadata:
  name: postsync-metric-test-nginx
  namespace: postsync-test
  labels:
    app: postsync-metric-test
    kubeaid.io/managed-by: kubeaid
data:
  # Exposes nginx's stub_status on :8081 so the exporter sidecar can scrape it.
  stub_status.conf: |
    server {
        listen 8081;
        location = /stub_status {
            stub_status on;
        }
    }
