apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: enableit-api
  namespace: monitoring
spec:
  groups:
  - name: Cron Job Alerts
    rules:
      - alert: CronJobMissedOrFailed
        expr: cron_job_last_run == 0
        labels:
          severity: critical
        annotations:
          summary: "Cron job failed"
          description: "The cron job {{`{{ $labels.cron_job }}`}} has not run properly with status - {{`{{ $labels.status }}`}}."

  - name: Queue Job Alerts
    rules:
      - alert: QueueJobMissedOrFailed
        expr: queue_failures == 0
        labels:
          severity: critical
        annotations:
          summary: "Queue job failed"
          description: "The queue job {{`{{ $labels.queue_job }}`}} has not run properly for customer ID {{`{{ $labels.customer_id }}`}} with status - {{`{{ $labels.status }}`}}."

  - name: monitor::service::apigo
    rules:
      - alert: FailedToFetchCVEScore
        expr: increase(failed_to_fetch_cve_score[30m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Failed to fetch CVE score for customer {{`{{ $labels.customer_id }}`}} from Prometheus"
          description: "Failed to fetch CVE score from Prometheus for customer {{`{{ $labels.customer_id }}`}} at {{`{{ $labels.customer_url }}`}} for the CVE metric type {{`{{ $labels.cve_metric_type }}`}} due to failure to find Prometheus or an excessive timeout."

      - alert: CVEScoreCacheRefreshFailure
        expr: increase(cve_score_cache_refesh_failure[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "CVE Score cache refresh failure detected for customer {{`{{ $labels.customer_id }}`}} on hkey {{`{{ $labels.hkey }}`}}"
          description: "A CVE Score cache refresh failure occurred for customer {{`{{ $labels.customer_id }}`}} on hkey {{`{{ $labels.hkey }}`}}."

      - alert: MissingNodeCountDetected
        expr: increase(days_missing_node_count_metric[1d]) > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Missing node count detected"
          description: "Node count data is missing for cluster {{`{{ $labels.cluster_name }}`}}."

      - alert: CertificateAuthFailureDetected
        expr: increase(certificate_auth_failure{instance="prod"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Certificate authentication failure detected for {{`{{ $labels.certname }}`}} on endpoint {{`{{ $labels.endpoint }}`}}"
          description: "The certificate authentication failure with status {{`{{ $labels.status }}`}} has occurred on the endpoint {{`{{ $labels.endpoint }}`}} in {{`{{ $labels.instance }}`}}."

      - alert: InternalServerFailureDetected
        expr: increase(server_side_failure[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Internal server failure detected for {{`{{ $labels.certname }}`}} on endpoint {{`{{ $labels.endpoint }}`}}"
          description: "An internal server failure (500 status) occurred for customer {{`{{ $labels.customer_id }}`}} on endpoint {{`{{ $labels.endpoint }}`}}."

      - alert: ExternalAPIFailureDetected
        expr: increase(external_api_failure[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "External API failure detected for {{`{{ $labels.service }}`}} endpoint ({{`{{ $labels.endpoint }}`}})"
          description: "The external API {{`{{ $labels.service }}`}} endpoint {{`{{ $labels.endpoint }}`}} failed with failure status {{`{{ $labels.status }}`}} for customer {{`{{ $labels.customer_id }}`}} using certificate {{`{{ $labels.certname }}`}}."

      - alert: CacheFailureDetected
        expr: increase(cache_failure[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Cache failures detected for {{`{{ $labels.operation }}`}} operation on {{`{{ $labels.hkey }}`}}"
          description: "Cache failure of type {{`{{ $labels.type }}`}} for operation {{`{{ $labels.operation }}`}} on hkey {{`{{ $labels.hkey }}`}}."

      - alert: ClientSideFailure
        expr: increase(client_side_failure[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Client Side Failure Detected"
          description: "Client-side failures detected for customer {{`{{ $labels.customer_id }}`}} at endpoint {{`{{ $labels.endpoint }}`}} with status {{`{{ $labels.status }}`}}."

      - alert: ObmondoInstallScriptFailure
        expr: obmondo_api_install_script_status == 1
        labels:
          severity: critical
        annotations:
          summary: "install script has failed for customer, please look into it at highest priority"
          description: "The obmondo install script for {{`{{ $labels.certname }}`}} has failed"
