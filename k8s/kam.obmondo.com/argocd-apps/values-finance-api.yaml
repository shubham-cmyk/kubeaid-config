namespace: finance
replicaCount: 1
image:
    repository: harbor.obmondo.com/obmondo/finance-api
    tag: v0.13.3
    pullPolicy: Always


imagePullSecrets:
  - name: harbor-registry-secret

mode: prod
# Specifies the level of logs in prod; info, warn or error
log_level: error

ingress:
  enabled: true
  # className: traefik-cert-manager
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd
  hosts:
    - host: finance-api.obmondo.com
      paths:
        - path: /api/v1/invoice
          pathType: Prefix
        - path: /api/v1/employees
          pathType: Prefix
        - path: /api/v1/ping
          pathType: Prefix
        - path: /api/v1/auth
          pathType: Prefix
        - path: /api/v1/expenses
          pathType: Prefix
        - path: /swagger/go
          pathType: Prefix
        - path: /api/v1/incomes
          pathType: Prefix
  tls:
    - secretName: finance-api-obmondo-com-tls
      hosts:
        - finance-api.obmondo.com

postgresql:
  storageClass: rook-ceph-block
  affinity:
    nodeSelector:
      disk: nvme
  resources:
    requests:
      memory: 256Mi
      cpu: 300m
    limits:
      memory: 512Mi
      cpu: 600m

tls:
  secret: finance-api-puppet-cert

service_cert:
  secret: finance-api-puppet-cert
  path: /app/tls/certificates/
  cert_path: /app/tls/certificates/tls.crt
  key_path: /app/tls/certificates/tls.key

keycloak:
  url: "https://keycloak.obmondo.com/auth/realms"
  realm: "Obmondo"
  client_id: "finance-api"
  owner_role: "finance-admin"
  client_secret:
    name: finance-api-keycloak
    key: client_secret
  redirect_uri: "https://finance.obmondo.com/login"

obmondo_api:
  base_url: https://api.obmondo.com


redis:
  replicas: 3
  storage: 4Gi
  url: redis://redis-cluster-finance-api-leader:6379

persistence:
  enabled: true
  invoices:
    size: 2Gi
    accessMode: ReadWriteMany
    storageClass: ceph-filesystem

mail:
  from: "info@enableit.dk"
  host: "mail.system"
  port: 587
  to: "klavs@obmondo.com"

chat:
  host: "https://chat.obmondo.com"
  token:
    name: chat-token
    key: token
  team_name: "obmondo"

serviceMonitor:
  enabled: true
  scrapeTimeout: "10s"
  port: http
  interval: 10s
  additionalLabels: {}

prometheusRule:
  enabled: true
  # Financial Metrics
  vatSeverity: critical
  invoiceAmountThreshold: 1000000
  invoiceSeverity: warning

  # API Performance
  errorRateThreshold: 0.05
  errorRateSeverity: critical
  latencyThreshold: 2
  latencySeverity: warning
  concurrentRequestsThreshold: 100
  concurrentRequestsSeverity: warning

  # Database Performance
  dbQueryThreshold: 1
  dbQuerySeverity: warning
  dbErrorThreshold: 0.05
  dbErrorSeverity: warning
  dbConnectionSeverity: critical

  # Authentication
  authLatencyThreshold: 1
  authLatencySeverity: warning
  authFailureThreshold: 5
  authFailureSeverity: critical
  certAuthFailureThreshold: 5
  certAuthFailureSeverity: critical

  # Cache Performance
  cacheHitRatioThreshold: 0.7
  cacheHitRatioSeverity: warning

  # Invoice Processing
  invoiceProcessingThreshold: 30
  invoiceProcessingSeverity: warning
  invoiceGenerationFailureThreshold: 0.1
  invoiceGenerationFailureSeverity: critical

  # Cron Jobs - per-schedule thresholds to avoid false positives (see finance-api docs/metrics/cron-job-alerts.md)
  cronJobTimeoutDaily: 90000    # 25h - daily crons (ExchangeRate, Products, ExpenseCeiling, CompareinvoiceTotalHours, overdue_invoices)
  cronJobTimeoutWeekday: 262800 # 73h - GenerateInvoiceCron (Mon-Fri 17:00)
  cronJobTimeoutWeekly: 691200   # 8d  - CustomerUnnaprovedHoursCron (Fri 09:00)
  cronJobTimeoutSeverity: critical
  cronJobDurationThreshold: 300
  cronJobDurationSeverity: warning
  cronJobFailureThreshold: 0
  cronJobFailureSeverity: critical

extraEnv:
  - name: ACCESS_LIST_CERTNAMES
    value: "svc-bridge.enableit,financeapi-client,obmondo-api.enableit"
