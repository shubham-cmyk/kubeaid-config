harbor:
  expose:
    tls:
      certSource: secret
      secret:
        secretName: harbor-cert
    ingress:
      hosts:
        core: harbor.obmondo.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        kubernetes.io/ingress.class: traefik-cert-manager
  externalURL: https://harbor.obmondo.com
  core:
    existingSecret: harbor-core-custom
    secretName: harbor-core-custom
    existingXsrfSecret: harbor-core-custom
  jobservice:
    existingSecret: harbor-core-custom
  registry:
    existingSecret: harbor-core-custom
    credentials:
      existingSecret: harbor-core-custom
  persistence:
    persistentVolumeClaim:
      registry:
        size: 270Gi
      jobservice:
        jobLog:
          size: 3Gi

postgres:
  size: 6Gi
  logicalbackup:
    enabled: true
    s3bucket: "kam-postgres-logical-backup"
    s3bucketscopesuffix: "harbor"
    provider: "s3"
    s3endpoint: "https://s3.obmondo.com"
    retention: "30"
