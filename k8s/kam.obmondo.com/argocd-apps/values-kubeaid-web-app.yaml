replicaCount: 1
namespace: obmondo-website
image:
  tag: kubeaid-v4.4.4
  pullPolicy: Always
middleware: true
ingress:
  hosts:
    - host: www.kubeaid.io
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.kube-aid.io
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: kube-aid.io
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: kubeaid.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: k8id-io-tls
      hosts:
        - www.kubeaid.io
        - www.kube-aid.io
        - kubeaid.io
        - kube-aid.io
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-kubeaid-web-app-redirect@kubernetescrd
