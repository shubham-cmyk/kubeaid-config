mattermost-operator:
  mattermostOperator:
    enabled: true
    replicas: 1
    rbac:
      create: true
    serviceAccount:
      create: true
    env:
      maxReconcilingInstallations: 20
      maxReconcilingConcurrency: 10
      requeuOnLimitDelay: 20s
    image:
      repository: mattermost/mattermost-operator
      tag: v1.23.0
      pullPolicy: IfNotPresent
    args:
      - --enable-leader-election
      - --metrics-addr=0.0.0.0:8383
mattermost:
  name: mattermost
  image: mattermost/mattermost-team-edition
  imagePullPolicy: IfNotPresent
  version: 10.12.14
  size: 150users
  extraPorts:
    - name: matternelle
      containerPort: 8989
      protocol: TCP
  resources:
    limits:
      cpu: '5'
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 500Mi
  useServiceLoadBalancer: false
  serviceAnnotations: {}
  ingress:
    enabled: true
    host: chat.obmondo.com
    tlsSecret: chat.obmondo.com
    annotations:
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
