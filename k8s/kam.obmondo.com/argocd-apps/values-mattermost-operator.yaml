mattermost-operator:
  mattermostOperator:
    enabled: true
    replicas: 1
    rbac:
      create: true
    serviceAccount:
      create: true
    env:
      maxReconcilingInstallations: 20
      maxReconcilingConcurrency: 10
      requeuOnLimitDelay: 20s
    image:
      repository: mattermost/mattermost-operator
      tag: v1.23.0
      pullPolicy: IfNotPresent
    args:
      - --enable-leader-election
      - --metrics-addr=0.0.0.0:8383
mattermost:
  name: mattermost
  image: mattermost/mattermost-team-edition
  imagePullPolicy: IfNotPresent
  version: 10.3.1
  size: 150users
  useServiceLoadBalancer: false
  serviceAnnotations: {}
  ingress:
    enabled: true
    host: mattermost.kam.obmondo.com
    annotations:
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
  mattermostEnv:
    - name: MM_FILESETTINGS_AMAZONS3SSE
      value: "true"
    - name: MM_FILESETTINGS_AMAZONS3SSL
      value: "true"
    - name: MM_GITLABSETTINGS_ENABLE
      value: "true"
    - name: MM_GITLABSETTINGS_ID
      value: "mattermost"
    - name: MM_GITLABSETTINGS_SECRET
      value: "cnHtlkgqKSanPmh4upjOJUmHw4hJutdN"
    - name: MM_GITLABSETTINGS_USERAPIENDPOINT
      value: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/userinfo"
    - name: MM_GITLABSETTINGS_AUTHENDPOINT
      value: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/auth"
    - name: MM_GITLABSETTINGS_TOKENENDPOINT
      value: "https://keycloak.obmondo.com/auth/realms/Obmondo/protocol/openid-connect/token"
    - name: MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS
      value: "enableit.dk,obmondo.com,blackwoodseven.com,vsen.dk,gnhearing.com,gn.com,gnresound.com,jabra.com,ks.kk.dk,kk.dk,ebillet.dk,kilroy.net,hobbii.dk,mindcore.dk,hbkworld.com,churchdesk.com,sdfi.dk,pm.me,cybernordic.dk,opus.com,opusaris.com,rybner.dk,image2work.com,grandpedersen.dk,gmail.com,kds.dk,kantar.com,webpros.com"
    - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
      value: "true"
    - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
      value: "https://push-test.mattermost.com"
    - name: MM_SERVICESETTINGS_SITEURL
      value: "https://mattermost.kam.obmondo.com"
    - name: MM_SERVICESETTINGS_COLLAPSEDTHREADS
      value: "default_on"
    - name: MM_SERVICESETTINGS_THREADAUTOFOLLOW
      value: "true"
    - name: MM_SERVICESETTINGS_ENABLELINKPREVIEWS
      value: "true"
    - name: MM_SERVICESETTINGS_RESTRICTLINKPREVIEWS
