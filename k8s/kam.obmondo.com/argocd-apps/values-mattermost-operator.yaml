matternelle:
  domain: webchat.obmondo.com

postgres:
  size: 20Gi
  instance: 2
  pass: mattermost-pgsql-app
  storageClass: zfs-localpv
  logicalbackup:
    enabled: true
    s3bucket: "logical-backup-kam"
    provider: "s3"
    s3endpoint: "https://bucket.obmondo.com"
    retension: "30"
