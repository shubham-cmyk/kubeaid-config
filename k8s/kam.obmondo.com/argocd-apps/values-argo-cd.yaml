---
argo-cd:
  dex:
    enabled: false
  repoServer:
    replicas: 2
    autoscaling:
      enabled: false
  configs:
    secret:
      createSecret: false     # managed by sealed-secrets now
  server:
    rbacConfig:
      policy.csv: |
        g, ArgoCDAdmins, role:admin
        g, ArgoCDDevs, role:readonly
    extraArgs:
      - --insecure
    config:
      url: https://argocd.kam.obmondo.com
      oidc.config: |
        name: Keycloak
        issuer: https://keycloakx.kam.obmondo.com/auth/realms/Obmondo
        clientID: argocd
        clientSecret: $oidc.keycloak.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        kubernetes.io/ingress.class: traefik-cert-manager
      hosts:
      - argocd.kam.obmondo.com
      tls:
      - secretName: argocd-ssl
        hosts:
        - argocd.kam.obmondo.com
