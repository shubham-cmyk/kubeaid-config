---
keycloakx:
  dbchecker:
    enabled: true
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      kubernetes.io/ingress.class: traefik-cert-manager
    rules:
      - host: keycloak.obmondo.com
        paths:
          - path: /
            pathType: Prefix
      - host: keycloakx.kam.obmondo.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-ssl
        hosts:
          - keycloak.obmondo.com
          - keycloakx.kam.obmondo.com

postgresql:
  access_secret: keycloakx-pgsql-postgres-pod-env
  size: 8Gi
