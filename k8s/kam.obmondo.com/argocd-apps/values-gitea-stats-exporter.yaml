image:
  repository: harbor.obmondo.com/obmondo/gitea-stats-exporter
  pullPolicy: Always
  tag: v1.1.0

ingress:
  enabled: true
  hosts:
    - host: gitea-stats.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: gitea-stats-tls
      hosts:
        - gitea-stats.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
