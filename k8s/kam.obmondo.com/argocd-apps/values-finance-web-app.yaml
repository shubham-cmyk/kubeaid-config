replicaCount: 1
image:
  tag: finance-v3.3.2
  pullPolicy: Always
ingress:
  hosts:
    - host: finance.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: finance-obmondo-com-tls
      hosts:
        - finance.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
