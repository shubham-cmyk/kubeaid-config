replicaCount: 1
image:
  tag: v1.1.4
  pullPolicy: Always
ingress:
  hosts:
    - host: obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: obmondo-com-tls
      hosts:
        - obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
