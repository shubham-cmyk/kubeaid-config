replicaCount: 1
image:
  tag: obmondo-v2.3.4
  pullPolicy: Always
ingress:
  hosts:
    - host: obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.obmondo.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: obmondo.in
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.obmondo.in
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: obmondo.dk
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.obmondo.dk
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: obmondo-com-tls
      hosts:
        - obmondo.com
        - obmondo.in
        - obmondo.dk
        - www.obmondo.com
        - www.obmondo.in
        - www.obmondo.dk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
