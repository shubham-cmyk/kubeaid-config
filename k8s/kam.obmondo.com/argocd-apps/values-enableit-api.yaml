internalIpRanges:
  - "135.181.21.167"   # kbm01
  - "135.181.21.154"   # kbm02
  - "135.181.21.153"   # kbm03
  - "135.181.223.235"  # kbw01
  - "65.21.130.86"     # kbw02
  - "65.21.130.85"     # kbw03
  - "78.46.72.21"      # kam01
  - "176.9.124.207"    # kam02
  - "85.10.211.48"     # kam03
  - "138.201.82.121"   # kaw01
  - "138.201.224.126"  # kaw02
  - "172.20.0.0/16"    # Internal service ip range k8s
trustedProxies:
  - 172.20.0.0/16
image:
  pullPolicy: Always
api:
  email:
    overview: ["klavs.klavsen@enableit.dk"]
  website: https://obmondo.com
  domain: api.obmondo.com
  goApiUrl: '"https://api.obmondo.com/api/"'
  config:
    startSchedular: true
    addDevPrefixes: false
    allowTestData: false
  puppetdb:
    url: 'http://puppet.enableit.dk:58080'
  puppetserver:
    url: 'https://puppet.enableit.dk'
  mattermost:
    channel: enableit
    enabled: true
  chat:
    teamid: iu94xkqsgjgj5ne4eeie1harcr
    userid: dpg87od6hpy5zpnhjw99qhbw3r
  clojure:
    image:
      repository: harbor.obmondo.com/obmondo/clojure-api/api
      pullPolicy: Always
      tag: v3.0.37-xenial
  go:
    image:
      repository: harbor.obmondo.com/obmondo/enableit-go-api
      pullPolicy: Always
      tag: v0.0.51
  server:
    internal_ips_for_readonly_auth: "172.20.0.0/16"
  redis:
    url: redis://redis-cluster-enableit-api-leader:6379

persistence:
  enabled: true
ci:
  enabled: false
pgdump:
  enabled: false

ingress:
  hosts:
    - host: api.obmondo.com
      paths:
        - path: /api/ping
          pathType: Prefix
          servicePort: 8080
        - path: /api/notify
          pathType: Prefix
          servicePort: 8080
        - path: /api/window
          pathType: Prefix
          servicePort: 8080
        - path: /api/tag
          pathType: Prefix
          servicePort: 8080
        - path: /api/user-location
          pathType: Prefix
          servicePort: 8080
        - path: /swagger/go
          pathType: Prefix
          servicePort: 8080
        - path: /api/timereg
          pathType: Prefix
          servicePort: 8080
        - path: /api/report/error
          pathType: Prefix
          servicePort: 8080
        - path: /api/invoice/
          pathType: Prefix
          servicePort: 8080
        - path: /api/servers/tags
          pathType: Prefix
          servicePort: 8088
        - path: /api/servers/
          pathType: Prefix
          servicePort: 8080
        - path: /Webtee
          pathType: Prefix
          serviceName: enableit-api-grpc
          servicePort: 8100
        - path: /
          pathType: ImplementationSpecific
          servicePort: 8088
  tls:
    - secretName: api-obmondo-com-tls
      hosts:
        - api.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd

postgresql:
  instances: 2
  logicalBackup:
    enabled: true
    s3bucket: kam-postgres-logical-backup
    s3endpoint: https://s3.obmondo.com
    s3region: dummy
    s3accesskeyid: kam
    s3accesssecretkey: aws-secret-token
    retention: '7 days'

serviceMonitor:
  enabled: true

extraEnv:
  - name: PUPPET_API
    value: http://puppet.enableit.dk:58080
  - name: PUPPET_TIMEOUT
    value: 30
