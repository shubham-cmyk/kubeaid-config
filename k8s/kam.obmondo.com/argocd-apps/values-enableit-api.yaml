image:
  pullPolicy: Always
api:
  start-schedular: true
  add-dev-prefixes: false
  allow_test_data: false
  website: https://api.kam.obmondo.com
  domain: api.kam.obmondo.com
  puppetdb:
    url: 'http://puppet.enableit.dk:58080'
  puppetserver:
    url: 'http://puppet:8140'
  mattermost:
    enable: true
    channel: enableit
  chat:
    teamid: iu94xkqsgjgj5ne4eeie1harcr
    userid: dpg87od6hpy5zpnhjw99qhbw3r
  clojure:
    logging:
      level: ':debug'
persistence:
  enabled: true
ci:
  enabled: true

pgdump:
  enabled: false

ingress:
  hosts:
    - host: api.kam.obmondo.com
      paths:
        - path: /api/ping
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/notify
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/window
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/tag
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/user-location
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /swagger/go
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/timereg
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/report/error
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /api/invoice/
          pathType: Prefix
          serviceName: enableit-go-api-enableit-api
          servicePort: 80
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: api-obmondo-com-tls
      hosts:
        - api.kam.obmondo.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: traefik-cert-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: traefik-api-puppet-agent-tls-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: obmondo-website-cn-header-enableit-api@kubernetescrd

postgresql:
  access_secret: api-postgresql-postgres-pod-env
  logicalBackup: "false"

serviceMonitor:
  enabled: true
