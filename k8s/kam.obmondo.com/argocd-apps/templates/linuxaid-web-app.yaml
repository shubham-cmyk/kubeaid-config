apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linuxaid-web-app
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-website
  project: default
  sources:
    - repoURL: 'https://gitlab.enableit.dk/obmondo/obmondo-web-app.git'
      path: .helm/web-app
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-linuxaid-web-app.yaml
    - repoURL: 'https://gitea.obmondo.com/EnableIT/kubernetes-config-enableit.git'
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated: null
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
