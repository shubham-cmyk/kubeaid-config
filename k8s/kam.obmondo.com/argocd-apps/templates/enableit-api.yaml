apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enableit-api
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-website
  project: default
  sources:
    - repoURL: https://gitea.obmondo.com/EnableIT/clojure-api.git
      path: helm/enableit-api
      targetRevision: api_on_kam
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-enableit-api.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubeaid-config-enableit.git
      targetRevision: api_kam
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
