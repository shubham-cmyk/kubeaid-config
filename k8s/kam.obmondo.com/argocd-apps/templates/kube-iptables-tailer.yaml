apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-iptables-tailer
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: system
  project: default
  sources:
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8id.git
      path: argocd-helm-charts/kube-iptables-tailer
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-kube-iptables-tailer.yaml
    - repoURL: https://gitea.obmondo.com/EnableIT/kubernetes-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
