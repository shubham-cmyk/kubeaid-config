apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-iptables-tailer
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: system
  project: default
  source:
    path: argocd-helm-charts/kube-iptables-tailer
    repoURL: https://gitlab.enableit.dk/kubernetes/argocd-apps.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kam.obmondo.com/argocd-apps/values-kube-iptables-tailer.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
