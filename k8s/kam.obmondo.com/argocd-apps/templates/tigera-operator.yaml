apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tigera-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: tigera-operator
    server: 'https://kubernetes.default.svc'
  source:
    path: argocd-helm-charts/tigera-operator/
    repoURL: 'https://gitea.obmondo.com/EnableIT/KubeAid.git'
    targetRevision: HEAD
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
