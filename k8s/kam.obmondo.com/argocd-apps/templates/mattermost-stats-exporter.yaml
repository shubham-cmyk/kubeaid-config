apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mattermost-stats-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: mattermost
  project: default
  source:
    path: src/mattermost-stats-exporter/helm
    repoURL: https://gitlab.enableit.dk/kubernetes/k8id-support-software
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kam.obmondo.com/argocd-apps/values-mattermost-stats-exporter.yaml
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
