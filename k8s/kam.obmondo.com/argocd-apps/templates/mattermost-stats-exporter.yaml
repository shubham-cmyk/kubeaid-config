apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mattermost-stats-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: mattermost
  project: default
  sources:
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8id-support-software
      path: src/mattermost-stats-exporter/helm
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-mattermost-stats-exporter.yaml
    - repoURL: https://gitlab.enableit.dk/kubernetes/kubernetes-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
