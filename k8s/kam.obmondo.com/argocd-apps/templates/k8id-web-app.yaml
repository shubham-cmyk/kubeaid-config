apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8id-web-app
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-website
  project: default
  sources:
    - repoURL: https://gitlab.enableit.dk/obmondo/k8id-web-app.git
      path: .helm/k8id-web-app
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-k8id-web-app.yaml
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8s-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated: null
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
