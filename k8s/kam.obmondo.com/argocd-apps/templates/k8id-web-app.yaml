apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8id-web-app
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: obmondo-website
  project: default
  source:
    path: .helm/k8id-web-app
    repoURL: https://gitlab.enableit.dk/obmondo/k8id-web-app.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kam.obmondo.com/argocd-apps/values-k8id-web-app.yaml
  syncPolicy:
    automated: null
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
