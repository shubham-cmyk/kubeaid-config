apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  project: default
  sources:
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8id.git
      path: argocd-helm-charts/whoami
      targetRevision: 7132-test-TLS-on-KAM
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-whoami.yaml
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8s-config-enableit.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
