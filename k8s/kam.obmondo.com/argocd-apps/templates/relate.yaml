apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relate
  namespace: argocd
spec:
  destination:
    namespace: system
    server: 'https://kubernetes.default.svc'
  source:
    path: argocd-helm-charts/relate
    repoURL: 'https://gitlab.enableit.dk/kubernetes/argocd-apps.git'
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - /tmp/https___gitlab.enableit.dk_kubernetes_kubernetes-config-enableit/k8s/kam.obmondo.com/argocd-apps/values-relate.yaml
  project: default
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
