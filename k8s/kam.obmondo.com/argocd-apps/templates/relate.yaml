apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relate
  namespace: argocd
spec:
  destination:
    namespace: relate
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8id.git
      path: argocd-helm-charts/relate
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/kam.obmondo.com/argocd-apps/values-relate.yaml
    - repoURL: https://gitlab.enableit.dk/kubernetes/k8s-config-enableit.git
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
