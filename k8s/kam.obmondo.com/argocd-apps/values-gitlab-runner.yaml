gitlab-runner:
  replicas: 3
  gitlabUrl: https://gitlab.enableit.dk/
  podLabels:
    cluster_tag: kam.obmondo.com
  envVars:
    - name: CLUSTER_TAG
      value: kam.obmondo.com

runner:
  nameSpace:
    create: true
    name: obmondo-ci
  serviceAccount:
    create: true
    name: obmondo-gitlab-ci
